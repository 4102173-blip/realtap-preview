<!DOCTYPE html>
<html lang="en" class="fs-m">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealTap — Real people test your Pi app</title>
  <style>
    :root {
      --a1:#6366f1;--a2:#4338ca;--a3:#3730a3;--accent-rgb:79,70,229;
      --bg: #eef2ff;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-solid: #ffffff;
      --surface-alt: #f8fafc;
      --ink: #0f172a;
      --sub: #475569;
      --mute: #64748b;
      --line: rgba(148, 163, 184, 0.28);
      --accent: #4f46e5;
      --accent-2: #10b981;
      --accent-soft: rgba(var(--accent-rgb), 0.11);
      --pi: #6d28d9;
      --pi-soft: rgba(109, 40, 217, 0.12);
      --green: #059669;
      --green-soft: rgba(16, 185, 129, 0.14);
      --red: #dc2626;
      --red-soft: rgba(220, 38, 38, 0.12);
      --yellow: #d97706;
      --yellow-soft: rgba(217, 119, 6, 0.14);
      --shadow-3d:
        0 0.65rem 1.4rem -0.5rem rgba(15, 23, 42, 0.14),
        0 0.2rem 0.5rem -0.15rem rgba(var(--accent-rgb), 0.08),
        inset 0 0.08rem 0.1rem rgba(255, 255, 255, 0.94),
        inset 0 -0.12rem 0.3rem rgba(148, 163, 184, 0.2);
      --shadow-btn:
        0 0.75rem 1.5rem -0.5rem rgba(var(--accent-rgb), 0.45),
        0 0.2rem 0.5rem -0.12rem rgba(15, 23, 42, 0.2),
        inset 0 0.09rem 0.12rem rgba(255, 255, 255, 0.55),
        inset 0 -0.18rem 0.45rem rgba(49, 46, 129, 0.55);
    }

    html.fs-s { font-size: 11.5px; }
    html.fs-m { font-size: 13px; }
    html.fs-l { font-size: 15.5px; }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans SC', 'Inter', sans-serif;
    }

    body {
      margin: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans SC', 'Inter', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 12%, rgba(var(--accent-rgb), 0.18), transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(16, 185, 129, 0.16), transparent 42%),
        radial-gradient(circle at 50% 95%, rgba(139, 92, 246, 0.14), transparent 50%),
        #e8eef9;
      min-height: 100vh;
    }

    .preview-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.9rem 0.75rem 1.75rem;
      gap: 0.9rem;
    }

    .preview-toolbar {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.65rem 0.9rem;
      border-radius: 1.25rem;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 0.75rem 1.75rem -0.75rem rgba(15, 23, 42, 0.18);
    }

    .viewport-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: all 0.25s ease;
    }

    .viewport-stage.mode-mobile #phone {
      width: 100%;
      max-width: 416px;
      height: 820px;
      max-height: calc(100vh - 5.2rem);
      border-radius: 2.3rem;
      border: 6px solid #0f172a;
      box-shadow:
        0 1.75rem 4rem -1rem rgba(15, 23, 42, 0.35),
        0 0 0 2px rgba(255, 255, 255, 0.65),
        inset 0 2px 4px rgba(255, 255, 255, 0.35);
    }

    .viewport-stage.mode-responsive #phone {
      width: 100%;
      max-width: 820px;
      height: 820px;
      max-height: calc(100vh - 5.2rem);
      border-radius: 1.75rem;
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 1.5rem 3.5rem -1rem rgba(15, 23, 42, 0.22);
    }

    #phone {
      position: relative;
      background: linear-gradient(180deg, #f8faff 0%, #eef2ff 55%, #f1f5f9 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: max-width 0.25s ease, border-radius 0.25s ease;
    }

    .proto-bar {
      background: linear-gradient(90deg, #1e1b4b 0%, #312e81 50%, #065f46 100%);
      color: #e0e7ff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.36rem 0.75rem;
      text-align: center;
      letter-spacing: -0.01em;
      flex-shrink: 0;
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.14);
    }

    #hdr {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.55rem 0.85rem;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      z-index: 15;
    }

    .hdr-copy {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #hdr b {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
      background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 55%, #059669 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #hdr small {
      color: var(--sub);
      font-size: 0.74rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #main {
      flex: 1;
      overflow-y: auto;
      padding: 0.55rem 0.75rem 4.6rem;
      scroll-behavior: smooth;
    }

    .emblem-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 2.35rem;
      height: 2.35rem;
      filter: drop-shadow(0 0.35rem 0.65rem rgba(var(--accent-rgb), 0.25));
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .emblem-3d svg { width: 100%; height: 100%; }
    .emblem-3d:hover { transform: translateY(-0.1rem) scale(1.04); }

    .ico-3d {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.72rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      box-shadow:
        0 0.45rem 0.85rem -0.3rem rgba(15, 23, 42, 0.22),
        inset 0 0.1rem 0.12rem rgba(255, 255, 255, 0.75),
        inset 0 -0.15rem 0.3rem rgba(15, 23, 42, 0.14);
    }

    .ico-3d svg { width: 1.25rem; height: 1.25rem; }
    .ico-3d.kind-apptest { background: linear-gradient(145deg, #818cf8 0%, #4f46e5 60%, #3730a3 100%); }
    .ico-3d.kind-survey { background: linear-gradient(145deg, #34d399 0%, #10b981 60%, #047857 100%); }
    .ico-3d.kind-verify { background: linear-gradient(145deg, #fbbf24 0%, #f59e0b 58%, #b45309 100%); }
    .ico-3d.kind-avatar { background: linear-gradient(145deg, #a78bfa 0%, #7c3aed 60%, #4c1d95 100%); }

    /* Search Bar */
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 0.45rem;
    }

    .search-ico {
      position: absolute;
      left: 0.72rem;
      width: 0.95rem;
      height: 0.95rem;
      color: var(--mute);
      pointer-events: none;
    }

    .search-in {
      width: 100%;
      padding: 0.48rem 2.1rem 0.48rem 2.15rem;
      border-radius: 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 0.84rem;
      font-family: inherit;
      box-shadow:
        0 0.4rem 0.9rem -0.4rem rgba(15, 23, 42, 0.12),
        inset 0 0.08rem 0.15rem rgba(15, 23, 42, 0.05);
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }

    .search-in:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 0.18rem rgba(var(--accent-rgb), 0.15);
    }

    .search-clear {
      position: absolute;
      right: 0.5rem;
      width: 1.35rem;
      height: 1.35rem;
      border: 0;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.24);
      color: var(--sub);
      font-size: 0.72rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Wallet History Controls */
    .hist-controls {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 0.65rem;
      padding: 0.55rem;
      border-radius: 0.9rem;
      background: rgba(248, 250, 252, 0.82);
      border: 1px solid var(--line);
    }

    .hist-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .hist-mode-pills {
      display: inline-flex;
      gap: 0.25rem;
      background: rgba(226, 232, 240, 0.75);
      padding: 0.18rem;
      border-radius: 0.72rem;
    }

    .hist-mode-btn {
      border: 0;
      background: transparent;
      color: var(--sub);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.28rem 0.58rem;
      border-radius: 0.55rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .hist-mode-btn.on {
      background: #ffffff;
      color: var(--accent);
      box-shadow: 0 0.18rem 0.45rem -0.15rem rgba(15, 23, 42, 0.16);
    }

    .hist-dates {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.35rem;
      align-items: center;
      margin-top: 0.1rem;
    }

    .hist-date-in {
      width: 100%;
      padding: 0.38rem 0.48rem;
      border-radius: 0.68rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 0.74rem;
    }

    .hist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.44rem 0;
      border-bottom: 1px solid rgba(148, 163, 184, 0.16);
    }

    .hist-item:last-child { border-bottom: 0; padding-bottom: 0.1rem; }
    .hist-label { font-size: 0.84rem; font-weight: 700; color: var(--ink); line-height: 1.25; }
    .hist-time { font-size: 0.71rem; color: var(--mute); margin-top: 0.14rem; font-variant-numeric: tabular-nums; }
    .hist-amt { font-size: 0.86rem; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* Cards */
    .card {
      background: var(--surface);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.88);
      border-radius: 1.15rem;
      padding: 0.75rem 0.85rem;
      margin-bottom: 0.65rem;
      box-shadow: var(--shadow-3d);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .card.task {
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card.task.compact {
      padding: 0.44rem 0.62rem;
      margin-bottom: 0.36rem;
      border-radius: 0.92rem;
    }

    .card.task.compact .ico-3d { width: 1.95rem; height: 1.95rem; border-radius: 0.6rem; }
    .card.task.compact .ico-3d svg { width: 1.05rem; height: 1.05rem; }
    .card.task.compact .title { font-size: 0.84rem; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card.task.compact .meta { font-size: 0.7rem; margin-top: 0.12rem; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card.task.compact .reward { padding: 0.24rem 0.48rem; border-radius: 0.62rem; }
    .card.task.compact .reward b { font-size: 0.8rem; }
    .card.task.compact .heart { padding: 0.28rem 0.38rem; font-size: 0.84rem; border-radius: 0.58rem; }

    .card.task::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255, 255, 255, 0.52) 0%, rgba(255, 255, 255, 0) 42%);
      pointer-events: none;
    }

    .card.task:hover {
      transform: translateY(-0.08rem);
      border-color: rgba(var(--accent-rgb), 0.38);
      box-shadow:
        0 0.85rem 1.6rem -0.5rem rgba(var(--accent-rgb), 0.2),
        0 0.3rem 0.7rem -0.2rem rgba(15, 23, 42, 0.12),
        inset 0 0.08rem 0.1rem rgba(255, 255, 255, 0.96);
    }

    .card.task:active { transform: translateY(0.05rem) scale(0.994); }
    .card h3 { margin: 0 0 0.45rem; font-size: 0.92rem; font-weight: 700; }

    .row { display: flex; align-items: center; gap: 0.55rem; }
    .grow { flex: 1; min-width: 0; }
    .title { font-weight: 700; font-size: 0.9rem; line-height: 1.32; color: var(--ink); }
    .meta { font-size: 0.76rem; color: var(--sub); margin-top: 0.18rem; line-height: 1.32; }
    .small { font-size: 0.78rem; color: var(--sub); line-height: 1.42; }
    .big { font-size: 1.38rem; font-weight: 800; letter-spacing: -0.02em; }
    .pi { color: var(--pi); font-weight: 800; }

    .reward {
      text-align: right;
      background: linear-gradient(145deg, rgba(109, 40, 217, 0.12), rgba(var(--accent-rgb), 0.06));
      padding: 0.34rem 0.58rem;
      border-radius: 0.78rem;
      border: 1px solid rgba(109, 40, 217, 0.16);
      box-shadow: inset 0 0.06rem 0.06rem rgba(255, 255, 255, 0.8);
      flex-shrink: 0;
    }

    .reward b { display: block; color: var(--pi); font-size: 0.86rem; font-weight: 800; line-height: 1.15; }
    .reward small { color: var(--sub); font-size: 0.66rem; }

    .heart {
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border: 1px solid var(--line);
      border-radius: 0.68rem;
      font-size: 0.95rem;
      cursor: pointer;
      padding: 0.35rem 0.46rem;
      line-height: 1;
      box-shadow: 0 0.22rem 0.5rem -0.15rem rgba(15, 23, 42, 0.12), inset 0 0.06rem 0.06rem #fff;
      transition: transform 0.16s ease;
      flex-shrink: 0;
    }

    .heart:active { transform: scale(0.9); }

    .tags { display: flex; flex-wrap: wrap; gap: 0.32rem; margin-top: 0.52rem; }
    .tag {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.16rem 0.5rem;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.16);
      color: var(--sub);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .tag.inline-tag { font-size: 0.63rem; padding: 0.08rem 0.38rem; margin-left: 0.28rem; vertical-align: middle; }
    .tag.b { background: var(--accent-soft); color: var(--accent); }
    .tag.g { background: var(--green-soft); color: var(--green); }
    .tag.r { background: var(--red-soft); color: var(--red); }
    .tag.y { background: var(--yellow-soft); color: var(--yellow); }

    /* Segmented & Chips */
    .seg {
      display: flex;
      gap: 0.28rem;
      background: rgba(226, 232, 240, 0.75);
      padding: 0.22rem;
      border-radius: 0.88rem;
      margin-bottom: 0.45rem;
      box-shadow: inset 0 0.12rem 0.28rem rgba(15, 23, 42, 0.08);
    }

    .seg button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 0.42rem 0.35rem;
      border-radius: 0.68rem;
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--sub);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .seg button.on {
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      color: var(--ink);
      box-shadow: 0 0.32rem 0.75rem -0.2rem rgba(15, 23, 42, 0.16), inset 0 0.06rem 0.06rem #fff;
    }

    .chips {
      display: flex;
      gap: 0.38rem;
      overflow-x: auto;
      padding-bottom: 0.3rem;
      margin-bottom: 0.4rem;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      border: 1px solid rgba(255, 255, 255, 0.88);
      background: var(--surface);
      padding: 0.34rem 0.72rem;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--sub);
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 0.28rem 0.65rem -0.25rem rgba(15, 23, 42, 0.14), inset 0 0.06rem 0.06rem #fff;
      transition: all 0.16s ease;
    }

    .chip.on {
      background: linear-gradient(145deg, var(--a1), var(--a2));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0.45rem 0.95rem -0.3rem rgba(var(--accent-rgb), 0.5), inset 0 0.06rem 0.12rem rgba(255, 255, 255, 0.45);
    }

    /* Buttons */
    .btn {
      border: 1px solid rgba(255, 255, 255, 0.88);
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      color: var(--ink);
      padding: 0.58rem 0.82rem;
      border-radius: 0.88rem;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      box-shadow: 0 0.45rem 0.9rem -0.32rem rgba(15, 23, 42, 0.14), inset 0 0.08rem 0.08rem #fff;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover:not(:disabled) { transform: translateY(-0.06rem); }
    .btn:active:not(:disabled) { transform: translateY(0.1rem) scale(0.985); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn.p {
      background: linear-gradient(145deg, var(--a1) 0%, var(--a2) 65%, var(--a3) 100%);
      color: #fff;
      border-color: rgba(165, 180, 252, 0.35);
      box-shadow: var(--shadow-btn);
    }

    .btn.g {
      background: linear-gradient(145deg, #34d399, #059669);
      color: #fff;
      border-color: rgba(167, 243, 208, 0.35);
      box-shadow: 0 0.55rem 1.1rem -0.35rem rgba(16, 185, 129, 0.45), inset 0 0.08rem 0.1rem rgba(255, 255, 255, 0.5);
    }

    .btn.red {
      background: linear-gradient(145deg, #f87171, #dc2626);
      color: #fff;
      border-color: rgba(254, 202, 202, 0.35);
      box-shadow: 0 0.55rem 1.1rem -0.35rem rgba(220, 38, 38, 0.42), inset 0 0.08rem 0.1rem rgba(255, 255, 255, 0.45);
    }

    .btn.line {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(var(--accent-rgb), 0.25);
      color: var(--accent);
      box-shadow: 0 0.25rem 0.65rem -0.3rem rgba(var(--accent-rgb), 0.2);
    }

    .btn.sm { padding: 0.36rem 0.62rem; font-size: 0.76rem; border-radius: 0.68rem; }
    .btn.full { width: 100%; }

    .back {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
      color: var(--accent);
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.36rem 0.68rem;
      border-radius: 0.68rem;
      margin-bottom: 0.55rem;
      box-shadow: 0 0.22rem 0.55rem -0.2rem rgba(15, 23, 42, 0.1);
    }

    .kv {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
      padding: 0.32rem 0;
      font-size: 0.84rem;
    }

    hr { border: 0; border-top: 1px solid var(--line); margin: 0.55rem 0; }

    .note {
      padding: 0.58rem 0.72rem;
      border-radius: 0.85rem;
      font-size: 0.8rem;
      line-height: 1.45;
      background: var(--accent-soft);
      color: var(--ink);
      border: 1px solid rgba(var(--accent-rgb), 0.14);
    }

    .note.warn { background: var(--yellow-soft); border-color: rgba(217, 119, 6, 0.22); }
    .note.err { background: var(--red-soft); color: var(--red); border-color: rgba(220, 38, 38, 0.22); }
    .note.ok { background: var(--green-soft); color: var(--green); border-color: rgba(16, 185, 129, 0.22); }

    .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    label.f {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--sub);
      margin: 0.58rem 0 0.28rem;
    }

    .in {
      width: 100%;
      padding: 0.52rem 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 0.75rem;
      background: rgba(255, 255, 255, 0.94);
      color: var(--ink);
      font-size: 0.86rem;
      font-family: inherit;
      box-shadow: inset 0 0.1rem 0.22rem rgba(15, 23, 42, 0.05);
    }

    .in:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 0.18rem rgba(var(--accent-rgb), 0.16);
    }

    textarea.in { min-height: 4.1rem; resize: vertical; }

    .kind {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.45rem;
      margin-bottom: 0.55rem;
    }

    .kind button {
      border: 1px solid rgba(255, 255, 255, 0.88);

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.48rem 0.6rem;

        rgba(var(--accent-rgb), 0.08),

        rgba(16, 185, 129, 0.08) 0.6rem,

    /* toolbar (replaces Tailwind classes) */
    .tb-brand{display:flex;align-items:center;gap:.7rem}.tb-title{font-weight:800;font-size:.95rem;color:#0f172a}.tb-sub{font-size:.72rem;color:#64748b}

     return {lang:'en',fs:'m',tab:'explore',view:null,from:null,kind:'all',browse:'all',search:'',histQuery:'',histFilterMode:'all',histFrom:'',histTo:'',seg:'all',adv:false,saved:[2,9],theme:'indigo',

    let state=load();
    function load(){
      try{
        const s=localStorage.getItem('realtap-human-v6');
        if(s){
          const parsed=JSON.parse(s);
          if(typeof parsed.search!=='string')parsed.search='';if(!parsed.theme)parsed.theme='indigo';
          if(typeof parsed.histQuery!=='string')parsed.histQuery='';
          if(!parsed.histFilterMode)parsed.histFilterMode='all';
          if(typeof parsed.histFrom!=='string')parsed.histFrom='';
          if(typeof parsed.histTo!=='string')parsed.histTo='';
          return parsed;
        }
      }catch(e){}
      return seed();
    }
    function save(){try{localStorage.setItem('realtap-human-v6',JSON.stringify(state))}catch(e){}}

    const PiLayer={
      async authenticate(){return {username:state.me.username}},
      pay(amount,memo){return new Promise(res=>{
        openModal(`<h3>🟣 ${t('piTitle')}</h3><div class="note warn">${t('piAsk')}</div>
          <div class="card" style="margin:0.75rem 0;background:var(--surface-alt)"><div class="big pi">π ${fmt(amount)}</div><div class="small">${esc(memo)}</div></div>
          <div class="g2"><button class="btn" id="pc">${t('cancel')}</button><button class="btn p" id="po">${t('piConfirm')}</button></div>`);
        $('pc').onclick=()=>{closeModal();res(false)};
        $('po').onclick=()=>{openModal(`<div style="text-align:center;padding:0.9rem 0"><div class="spin"></div><b>${t('piWait')}</b></div>`);setTimeout(()=>{closeModal();res(true)},750)};
      })},
      payout(amount){return new Promise(res=>{openModal(`<div style="text-align:center;padding:0.9rem 0"><div class="spin"></div><b>${t('piWait')}</b></div>`);setTimeout(()=>{closeModal();res(true)},750)})}
    };

    function openModal(html){$('layer').innerHTML=`<div class="modalbg"><div class="sheet">${html}</div></div>`}
    function closeModal(){$('layer').innerHTML=''}
    let toastT;function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;$('phone').appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2400)}
    const THEMES={indigo:{a1:'#6366f1',a2:'#4338ca',a3:'#3730a3',ac:'#4f46e5',rgb:'79,70,229'},blue:{a1:'#3b82f6',a2:'#1d4ed8',a3:'#1e40af',ac:'#2563eb',rgb:'37,99,235'},green:{a1:'#10b981',a2:'#047857',a3:'#065f46',ac:'#059669',rgb:'5,150,105'},rose:{a1:'#fb7185',a2:'#e11d48',a3:'#9f1239',ac:'#e11d48',rgb:'225,29,72'},orange:{a1:'#fb923c',a2:'#ea580c',a3:'#9a3412',ac:'#ea580c',rgb:'234,88,12'},slate:{a1:'#64748b',a2:'#334155',a3:'#1e293b',ac:'#334155',rgb:'51,65,85'}};
    function applyTheme(){const th=THEMES[state.theme]||THEMES.indigo,r=document.documentElement.style;r.setProperty('--a1',th.a1);r.setProperty('--a2',th.a2);r.setProperty('--a3',th.a3);r.setProperty('--accent',th.ac);r.setProperty('--accent-rgb',th.rgb)}
    function toggleSw(){const r=$('swrow');if(r)r.classList.toggle('open')}
    function setTheme(k){state.theme=k;applyTheme();save();const th=THEMES[k],c=$('swcur');if(c)c.style.background=`linear-gradient(145deg,${th.a1},${th.a2})`;document.querySelectorAll('.swpanel .sw').forEach(b=>b.classList.toggle('on',b.dataset.k===k));const r=$('swrow');if(r)r.classList.remove('open')}
    function applyPrefs(){document.documentElement.lang=state.lang;document.documentElement.className='fs-'+state.fs;applyTheme()}
    function setLang(l){state.lang=l;applyPrefs();save();render()}
    function setFs(s){state.fs=s;applyPrefs();save();render()}
    function go(tab){state.tab=tab;state.view=null;state.from=null;save();render();$('main').scrollTop=0}
    function view(v){state.view=v;save();render();$('main').scrollTop=0}
    function openTask(id,from){state.tab='explore';state.from=from||null;view({name:'task',id})}
    function openReview(id){state.tab='activity';state.view={name:'review',id};save();render();$('main').scrollTop=0}
    function goBack(){const f=state.from;state.from=null;state.view=null;if(f)state.tab=f;save();render()}
    function releasePending(){const a=state.earn;const keep=[];a.pending.forEach(p=>{if(p.releaseAt<=now())a.available+=p.amount;else keep.push(p)});a.pending=keep}
    const taskById=id=>state.tasks.find(x=>x.id===id);
    const myResp=tk=>tk.responses.find(r=>r.user===state.me.username);
    function eligible(tk){
     const m=state.me;
     if(tk.requester===m.username)return{ok:false,msg:t('isMine')};
     if(myResp(tk))return{ok:false,msg:t('alreadyDone')};
     if(tk.status==='settled')return{ok:false,msg:t('isSettled')};
     if(tk.status==='paused')return{ok:false,msg:t('isPaused')};
     if(tk.responses.length>=tk.max)return{ok:false,msg:t('isFull')};
     if(tk.country!=='ANY'&&tk.country!==m.country)return{ok:false,msg:t('needCountry',cname(tk.country))};
     if(tk.lang!=='any'&&tk.lang!==m.lang&&tk.lang!==m.lang2)return{ok:false,msg:t('needLang',lname(tk.lang))};
     if(tk.kind==='apptest'&&tk.targetOs&&tk.targetOs!=='any'){
       const env=detectClientEnv();
       if(tk.targetOs!==env.os)return{ok:false,msg:t('needOs',t('os_'+tk.targetOs),env.osLabel)};
     }
     return{ok:true}
    }
    function toggleSave(id,ev){if(ev)ev.stopPropagation();const i=state.saved.indexOf(id);if(i>=0)state.saved.splice(i,1);else state.saved.push(id);save();render()}

    function onExploreSearch(val){
      state.search=val;
      save();
      const box=$('exploreList');
      const clr=$('searchClearBtn');
      if(clr)clr.style.display=val?'inline-flex':'none';
      if(box)box.innerHTML=renderExploreList();
      else render();
    }
    function clearExploreSearch(){
      state.search='';
      save();
      render();
      const inp=$('exploreSearchInput');
      if(inp)inp.focus();
    }

    function render(){
     releasePending();
     $('proto').textContent=t('proto');
     $('hdr').innerHTML=`${brandEmblemSvg()}<div class="hdr-copy"><b>RealTap</b><small>${t('tagline')}</small></div>`;
     const tabs=[['explore','🔎'],['create','➕'],['activity','📋'],['wallet','👛'],['me','🙂']];
     $('nav').innerHTML=tabs.map(([k,i])=>`<button class="${state.tab===k?'on':''}" onclick="go('${k}')"><span class="ni">${i}</span>${t('t_'+k)}</button>`).join('');
     const v=state.view,m=$('main');
     if(state.tab==='explore')m.innerHTML=v?.name==='task'?vTask(v.id):v?.name==='answer'?vAnswer(v.id):vExplore();
     else if(state.tab==='create')m.innerHTML=vCreate();
     else if(state.tab==='activity')m.innerHTML=v?.name==='review'?vReview(v.id):vActivity();
     else if(state.tab==='wallet')m.innerHTML=vWallet();
     else m.innerHTML=vMe();
     if(state.tab==='create')updateSummary();
    }

    function badges(tk,inline=false){
     const cls=inline?'tag inline-tag':'tag';
     const b=[`<span class="${cls} b">${t('k_'+tk.kind)}</span>`];
     if(tk.kind==='apptest'&&tk.appVersion)b.push(`<span class="${cls}">${esc(tk.appVersion)}</span>`);
     if(tk.kind==='apptest'&&tk.targetOs&&tk.targetOs!=='any')b.push(`<span class="${cls} b">${t('os_'+tk.targetOs)}</span>`);
     if(!inline&&tk.mode==='consensus')b.push(`<span class="${cls}">${t('modeC').split(' — ')[0]}</span>`);
     if(tk.sensitive)b.push(`<span class="${cls} r">⚠ ${t('sensitive')}</span>`);
     if(tk.status==='paused')b.push(`<span class="${cls} y">${t('underReview')}</span>`);
     if(tk.status==='settled')b.push(`<span class="${cls}">${t('finished')}</span>`);
     if(tk.requester===state.me.username)b.push(`<span class="${cls} g">${t('yours')}</span>`);
     else if(myResp(tk))b.push(`<span class="${cls} g">✓ ${t('done')}</span>`);
     else if(!eligible(tk).ok&&tk.status==='open'&&tk.responses.length<tk.max)b.push(`<span class="${cls} y">${t('locked')}</span>`);
     return b.join('')
    }

    function taskCard(tk){
     const left=Math.max(0,tk.max-tk.responses.length),sv=state.saved.includes(tk.id);
     const where=(tk.country!=='ANY'?flag(tk.country)+' ':'')+(tk.lang!=='any'?lname(tk.lang)+' · ':'');
     return `<div class="card task compact" onclick="openTask(${tk.id})"><div class="row">${kindBadge3d(tk.kind)}
      <div class="grow"><div class="title">${esc(ttl(tk))}</div><div class="meta">${where}${t('minutes',tk.minutes)} · ${t('spotsLeft',left)}${badges(tk,true)}</div></div>
      <div class="reward"><b>π ${fmt(tk.reward)}</b></div>
      <button class="heart ${sv?'on':''}" onclick="toggleSave(${tk.id},event)" aria-label="${t('save')}">${sv?'❤️':'🤍'}</button></div></div>`
    }

    function renderExploreList(){
     const saved=state.browse==='saved';
     const q=(state.search||'').trim().toLowerCase();
     let list=state.tasks.filter(x=>saved?state.saved.includes(x.id):x.status!=='settled');
     if(state.kind!=='all')list=list.filter(x=>x.kind===state.kind);
     if(q){
      list=list.filter(x=>{
       const hay=[ttl(x),x.appName,x.appVersion,x.title,x.desc,x.requester,t('k_'+x.kind)].join(' ').toLowerCase();
       return hay.includes(q);
      });
     }
     list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
     if(list.length)return list.map(taskCard).join('');
     const emptyMsg=q?t('noSearch',esc(state.search.trim())):(saved?t('noSaved'):t('noTasks'));
     return `<div class="card small" style="text-align:center">${emptyMsg}</div>`;
    }

       <input id="exploreSearchInput" class="search-in" type="search" value="${esc(state.search||'')}" placeholder="${t('searchPh')}" oninput="onExploreSearch(this.value)" />

      <div class="chips">${['all',...KINDS].map(c=>`<button class="chip ${state.kind===c?'on':''}" onclick="state.kind='${c}';save();render()">${t('k_'+c)}</button>`).join('')}</div>
      <div id="exploreList">${renderExploreList()}</div>`
    }

    function qTypeLabel(q){return {choice:t('qChoice'),text:t('qText'),rating:t('qRating')}[q.type]}
    function vTask(id){
     const tk=taskById(id);if(!tk)return '';
     const el=eligible(tk),sv=state.saved.includes(tk.id);
     const where=flag(tk.country)+' '+cname(tk.country)+(tk.lang!=='any'?' · '+lname(tk.lang):'');
     const stepsHtml=(tk.kind==='apptest'&&tk.steps&&tk.steps.length)?`<div style="margin-top:0.65rem"><div class="small" style="font-weight:700;color:var(--ink);margin-bottom:0.25rem">${t('steps')}</div>${tk.steps.map((st,i)=>`<div class="step-item" style="cursor:default"><span class="step-num">${i+1}</span><span>${esc(st)}</span></div>`).join('')}</div>`:'';

       <button class="heart ${sv?'on':''}" onclick="toggleSave(${tk.id},event)">${sv?'❤️':'🤍'}</button></div>
      <div class="tags">${badges(tk)}</div>
      ${tk.desc?`<p style="margin:0.75rem 0 0;line-height:1.55">${esc(tk.desc)}</p>`:''}
      ${stepsHtml}
      ${tk.kind==='apptest'?`<a class="btn p full" style="display:block;text-align:center;text-decoration:none;margin-top:0.75rem" href="${esc(safeUrl(tk.appUrl))}" target="_blank" rel="noopener">${t('openApp')}</a>`:''}
      ${tk.image?`<div class="imgph" title="${t('imgPlaceholder')}">🖼️</div>`:''}
      <hr><div class="kv"><span>${t('perPerson')}</span><b class="pi">π ${fmt(tk.reward)}</b></div>
      <div class="kv"><span>${t('spotsLeft','')}</span><b>${Math.max(0,tk.max-tk.responses.length)} / ${tk.max}</b></div>
      <div class="kv"><span>⏱ ${t('minutes',tk.minutes)}</span><b>${remain(tk.deadline)}</b></div>
      ${tk.kind==='apptest'?`<div class="kv"><span>${t('targetOs')}</span><b>${t('os_'+(tk.targetOs||'any'))}</b></div>`:''}
      ${tk.country!=='ANY'||tk.lang!=='any'?`<div class="kv"><span>${where}</span><b></b></div>`:''}</div>
     <div class="card"><h3>${t('howPaid')}</h3><div class="note">${tk.mode==='consensus'?t('expConsensus'):(tk.autoApprove?t('expAuto'):t('expReview'))}</div><p class="small" style="margin:0.5rem 0 0">${t('holdNote',CONFIG.holdDays)}</p></div>
     ${el.ok?`<button class="btn p full" onclick="view({name:'answer',id:${tk.id}})">${t('start')}</button>`:`<div class="note warn" style="margin-bottom:0.5rem">${el.msg}</div>`}
     <button class="btn line full" style="margin-top:0.5rem" onclick="reportTask(${tk.id})">⚑ ${t('report')}</button>`

    /* Progressive disclosure when tester picks "Problem" on an app check item */
    function onCheckChoiceChange(qid,val){
      const drawer=$('prob_drawer_'+qid);
      if(drawer)drawer.style.display=val==='problem'?'block':'none';
    }
    function handleBugShot(qid,input){
      const file=input.files&&input.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=e=>{
        const prev=$('shot_prev_'+qid);
        const hidden=$('shot_data_'+qid);
        if(hidden)hidden.value=e.target.result;
        if(prev){
          prev.innerHTML=`<div class="small" style="color:var(--green);font-weight:700;margin-top:0.35rem">✓ ${t('shotAttached')} (${esc(file.name)})</div><img class="shot-thumb" src="${e.target.result}" alt="Screenshot preview" />`;
        }
      };
      reader.readAsDataURL(file);
    }

    function vAnswer(id){
     const tk=taskById(id);if(!tk)return '';
     const chk=tk.kind==='apptest'?tk.questions.filter(q=>q.id.startsWith('c_')||q.id.startsWith('cc_')):[];
     const env=detectClientEnv();
     const stepsBlock=(tk.kind==='apptest'&&tk.steps&&tk.steps.length)

       :(tk.kind==='apptest'?`<div class="card"><h3>${t('steps')}</h3><p style="margin:0 0 0.6rem;line-height:1.55">${esc(tk.desc||'')}</p><a href="${esc(safeUrl(tk.appUrl))}" target="_blank" rel="noopener">${t('openApp')}</a></div>`:'');

     const envCard=tk.kind==='apptest'?`<div class="card" style="padding:0.6rem 0.78rem">

     ${envCard}

    const qBlock=(q,n)=>`<div class="q"><b>${n?n+'. ':''}${esc(qt(q))}</b>${q.optional?` <span class="small">(${t('optional')})</span>`:''}<div style="margin-top:0.45rem">${qInput(q,false)}</div></div>`;
    function qInput(q,withBugDrawer){
     if(q.type==='choice'){
      if(q.inline){
        const pills=`<div class="pills">${q.options.map(o=>`<label class="${o==='problem'?'pr':''}"><input type="radio" name="a_${q.id}" value="${esc(o)}" onchange="onCheckChoiceChange('${q.id}',this.value)">${esc(optLabel(o))}</label>`).join('')}</div>`;
        if(!withBugDrawer)return pills;
        return `${pills}
          <div id="prob_drawer_${q.id}" class="problem-drawer" style="display:none">
            <div class="small" style="font-weight:800;color:var(--red)">${t('bugSeverity')}</div>
            <div class="sev-pills">
              <label class="sev-blocker"><input type="radio" name="sev_${q.id}" value="blocker">${t('sev_blocker').split(' (')[0]}</label>
              <label class="sev-major"><input type="radio" name="sev_${q.id}" value="major" checked>${t('sev_major').split(' (')[0]}</label>
              <label class="sev-minor"><input type="radio" name="sev_${q.id}" value="minor">${t('sev_minor').split(' (')[0]}</label>
            </div>
            <input class="in" style="margin-top:0.42rem;font-size:0.8rem" id="bnote_${q.id}" placeholder="${t('bugNotePh')}" />
            <label class="btn sm line" style="display:inline-flex;align-items:center;gap:0.35rem;margin-top:0.42rem;cursor:pointer">
              📷 ${t('attachShot')}
              <input type="file" accept="image/*" style="display:none" onchange="handleBugShot('${q.id}',this)" />
            </label>
            <input type="hidden" id="shot_data_${q.id}" value="" />
            <div id="shot_prev_${q.id}"></div>
          </div>`;
      }

    function submitAnswer(id){
     const tk=taskById(id);if(!tk||!eligible(tk).ok)return;
     if(tk.sensitive&&!$('consent').checked){toast(t('needConsent'));return}
     if(tk.kind==='apptest'&&tk.steps&&tk.steps.length){
       const stepBoxes=[...document.querySelectorAll('.step-chk')];
       if(stepBoxes.some(cb=>!cb.checked)){toast(t('completeAllSteps'));return}
     }
     const ans={},bugDetails={};
     for(const q of tk.questions){
      let v='';
      if(q.type==='choice'||q.type==='rating'){const c=document.querySelector(`input[name="a_${q.id}"]:checked`);v=c?c.value:''}
      else v=document.querySelector(`textarea[name="a_${q.id}"]`).value.trim();
      if(!v&&!q.optional){toast(t('answerAll'));return}
      ans[q.id]=v;
      if(v==='problem'){
        const sevEl=document.querySelector(`input[name="sev_${q.id}"]:checked`);
        const noteEl=$('bnote_'+q.id);
        const shotEl=$('shot_data_'+q.id);
        bugDetails[q.id]={
          severity:sevEl?sevEl.value:'major',
          note:noteEl?noteEl.value.trim():'',
          shot:shotEl?shotEl.value:'',
          hasShot:Boolean(shotEl&&shotEl.value)
        };
      }
     }
     const env=detectClientEnv();
     const r={id:Date.now(),user:state.me.username,env:env.summary,answers:ans,bugDetails,status:'submitted',reason:'',amount:0,paid:false,at:Date.now()};
     if(tk.mode==='review'&&tk.autoApprove){r.status='approved';r.amount=tk.reward;r.paid=true;addPending(tk.reward,tk)}
     tk.responses.push(r);save();toast(t('submitted'));state.tab='activity';state.seg='done';state.view=null;state.from=null;render()
    }

    function validate(d){
     const e=[],tt=totals(d);
     if(d.kind==='apptest'){
       if(!d.appName.trim())e.push(t('e_name'));
       if(!/^https?:\/\/\S+\.\S+/i.test(d.appUrl.trim()))e.push(t('e_url'));
       if(!d.checks.length&&!d.customChecks.some(x=>x.trim()))e.push(t('e_checks'));
     }
     else{
      if(d.kind==='survey'&&!d.title.trim())e.push(t('e_title'));
      if(!d.questions.length)e.push(t('e_q'));
      if(d.questions.some(q=>!q.text.trim()))e.push(t('e_qtext'));
      if(d.questions.some(q=>q.type==='choice'&&q.options.filter(o=>o.trim()).length<2))e.push(t('e_opts'));
     }
     if(d.mode==='consensus'&&d.max<CONFIG.minConsensus)e.push(t('e_min',CONFIG.minConsensus));
     if(d.reward<suggestMin(d)-1e-9)e.push(t('e_reward'));
     if(tt.total>state.piBalance+1e-9)e.push(t('e_bal'));
     if(!d.ack)e.push(t('e_rules'));
     const text=(d.appName+' '+d.title+' '+d.desc+' '+d.steps.join(' ')+' '+d.customChecks.join(' ')+' '+d.questions.map(q=>q.text).join(' ')).toLowerCase();
     if(BANNED.some(b=>text.includes(b)))e.push(t('e_banned'));
     return e
    }
    async function publishDraft(){
     const d=state.draft;d.errors=validate(d);
     if(d.errors.length){render();$('main').scrollTop=0;return}
     const tt=totals(d);
     const ok=await PiLayer.pay(tt.total,'RealTap request escrow');
     if(!ok)return;
     const reqLabel=d.kind==='apptest'?d.appName.trim():(d.kind==='verify'?d.questions[0].text:d.title).trim();
     state.piBalance-=tt.total;state.history.unshift({k:'h_deposit',amt:-tt.total,note:reqLabel,at:now()});
     const id=Math.max(...state.tasks.map(x=>x.id))+1;
     const base={id,kind:d.kind,desc:d.desc.trim(),requester:state.me.username,rej:0,mode:d.mode,autoApprove:d.mode==='review'&&d.autoApprove,minutes:d.minutes,reward:d.reward,max:d.max,country:d.country,lang:d.lang,sensitive:d.sensitive,status:'open',deadline:now()+d.hours*H,createdAt:now(),responses:[]};
     if(d.kind==='apptest'){
       const cleanSteps=d.steps.map(s=>s.trim()).filter(Boolean);
       const cleanCustom=d.customChecks.map(c=>c.trim()).filter(Boolean);
       Object.assign(base,{
         appName:d.appName.trim(),
         appVersion:d.appVersion.trim(),
         targetOs:d.targetOs||'any',
         appUrl:d.appUrl.trim(),
         steps:cleanSteps,
         checks:[...d.checks],
         customChecks:cleanCustom,
         title:'',
         questions:appQuestions(d.checks,cleanCustom)
       });
     }
     else{d.questions.forEach((q,i)=>{q.id='q'+(i+1);q.options=q.options.filter(o=>o.trim())});Object.assign(base,{title:(d.kind==='verify'?d.questions[0].text:d.title).trim(),questions:d.questions})}
     state.tasks.unshift(base);
     state.draft=null;state.tab='activity';state.seg='req';state.view=null;save();toast(t('published'));render()
    }

    function appeal(id){const r=myResp(taskById(id));r.appealed=true;save();toast(t('appealed'));render()}

    function results(tk){
     const n=tk.responses.length||1;
     return tk.questions.map(q=>{
      if(q.type==='choice'){
        const c={};
        let blockerCnt=0,majorCnt=0,minorCnt=0;
        tk.responses.forEach(r=>{
          const a=r.answers[q.id];
          if(a)c[a]=(c[a]||0)+1;
          if(a==='problem'&&r.bugDetails&&r.bugDetails[q.id]){
            const sev=r.bugDetails[q.id].severity;
            if(sev==='blocker')blockerCnt++;
            else if(sev==='minor')minorCnt++;
            else majorCnt++;
          }
        });
        const worksCnt=c['works']||0;
        const passBadge=tk.kind==='apptest'?`<span class="tag ${worksCnt/n>=0.8?'g':'y'}" style="margin-left:0.35rem">${t('passRate',Math.round(worksCnt/n*100))}</span>`:'';
        const sevBadges=(blockerCnt||majorCnt||minorCnt)?`<div class="tags" style="margin-top:0.25rem">
          ${blockerCnt?`<span class="tag r">${t('sev_blocker').split(' (')[0]}: ${blockerCnt}</span>`:''}
          ${majorCnt?`<span class="tag y">${t('sev_major').split(' (')[0]}: ${majorCnt}</span>`:''}
          ${minorCnt?`<span class="tag b">${t('sev_minor').split(' (')[0]}: ${minorCnt}</span>`:''}
        </div>`:'';
        return `<div style="margin:0.75rem 0"><b style="font-size:0.86rem">${esc(qt(q))}</b>${passBadge}${sevBadges}${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([a,k])=>`<div class="kv" style="padding:0.18rem 0"><span style="color:${a==='problem'?'var(--red)':'var(--ink)'}">${esc(optLabel(a))}</span><span>${k} · ${Math.round(k/n*100)}%</span></div><div class="bar"><i style="width:${k/n*100}%;${a==='problem'?'background:var(--red)':''}"></i></div>`).join('')}</div>`;
      }
      if(q.type==='rating'){const v=tk.responses.map(r=>+r.answers[q.id]).filter(x=>x);const avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'–';
       return `<div class="kv"><span>${esc(qt(q))}</span><b>★ ${avg}</b></div>`}
      const tx=tk.responses.map(r=>r.answers[q.id]).filter(Boolean).slice(0,4);
      return tx.length?`<div style="margin:0.75rem 0"><b style="font-size:0.86rem">${esc(qt(q))}</b>${tx.map(x=>`<div class="small" style="color:var(--sub);margin-top:0.25rem">“${esc(x)}”</div>`).join('')}</div>`:''}).join('')
    }

    function vReview(id){
     const tk=taskById(id);if(!tk)return '';
     const pend=tk.responses.filter(r=>r.status==='submitted').length,s=tk.settlement;
     const manual=tk.mode==='review'&&!tk.autoApprove;
     let head='';
     if(tk.kind==='apptest'){
      const withP=tk.responses.filter(r=>Object.entries(r.answers).some(([k,v])=>(k.startsWith('c_')||k.startsWith('cc_'))&&v==='problem')).length;
      head=`<div class="note ${withP?'warn':'ok'}" style="margin-bottom:0.5rem">${t('issuesFound',withP,tk.responses.length)}</div>`}
     const list=manual?tk.responses.map(r=>`<div class="card">
       <div class="row"><b class="grow">${esc(r.user)}</b><span class="tag ${r.status==='approved'?'g':r.status==='rejected'?'r':'y'}">${r.status==='submitted'?t('pendingReview'):t('st_'+r.status)}</span></div>
       ${r.env?`<div style="margin-top:0.35rem"><span class="env-badge">📱 ${esc(r.env)}</span></div>`:''}
       ${tk.questions.map(q=>{
         const a=r.answers[q.id];if(!a)return '';
         const bd=(a==='problem'&&r.bugDetails&&r.bugDetails[q.id])?r.bugDetails[q.id]:null;
         const sevTag=bd?`<span class="tag ${bd.severity==='blocker'?'r':bd.severity==='minor'?'b':'y'}" style="margin-left:0.3rem">${esc(t('sev_'+(bd.severity||'major')).split(' (')[0])}</span>`:'';
         const bugNote=bd&&bd.note?`<div class="small" style="color:var(--red);margin-top:0.15rem">↳ ${esc(bd.note)}</div>`:'';
         const shotBadge=bd&&bd.hasShot?(bd.shot?`<img class="shot-thumb" src="${bd.shot}" alt="Bug screenshot" />`:`<div class="small" style="color:var(--accent);margin-top:0.15rem">📷 ${t('shotAttached')}</div>`):'';
         return `<div class="small" style="margin-top:0.42rem">${esc(qt(q))}</div><div style="${a==='problem'?'color:var(--red);font-weight:700':''}">${esc(optLabel(a))}${sevTag}</div>${bugNote}${shotBadge}`;
       }).join('')}
       ${r.reason?`<div class="small" style="margin-top:0.35rem">↳ ${esc(r.reason)}</div>`:''}
       ${tk.status!=='settled'?`<div class="g2" style="margin-top:0.6rem"><button class="btn sm g" onclick="setResp(${tk.id},${r.id},'approved')">${t('accept')}</button><button class="btn sm red" onclick="rejectModal(${tk.id},${r.id})">${t('reject')}</button></div>`:''}</div>`).join(''):'';
     return `<button class="back" onclick="view(null)">${t('back')}</button><h2 style="font-size:1.05rem;font-weight:800;margin:0 0 0.6rem">${esc(ttl(tk))}</h2>
      <div class="card"><div class="kv"><span>${t('progress',tk.responses.length,tk.max)}</span><b>π ${fmt(tk.reward*tk.max)}</b></div>
      ${tk.status==='settled'&&s?`<hr><div class="note ok">${t('settled')}</div>
       ${s.lowSample?`<div class="note warn" style="margin-top:0.35rem">${t('lowSample',CONFIG.minConsensus)}</div>`:''}${s.noConsensus?`<div class="note warn" style="margin-top:0.35rem">${t('noCons')}</div>`:''}
       <div class="kv"><span>${t('resWinners',s.winners,fmt(s.each))}</span></div><div class="kv"><span>${t('resLosers',s.losers)}</span></div><div class="kv"><span>${t('resRefund',fmt(s.refund))}</span></div>`
      :`<div class="note warn" style="margin-top:0.5rem">${manual?t('settleWarn'):t(tk.mode==='consensus'?'expConsensus':'expAuto')}</div><button class="btn p full" style="margin-top:0.6rem" onclick="settleTask(${tk.id})">${t('closeSettle')}${manual&&pend?' ('+pend+')':''}</button>`}</div>
      <div class="card"><h3>${tk.kind==='apptest'?t('qaSummaryTitle'):t('resultTitle')}</h3>${head}${results(tk)}</div>${list}`
    }
    function setResp(tid,rid,st){const r=taskById(tid).responses.find(x=>x.id===rid);r.status=st;r.reason='';save();render()}
    function rejectModal(tid,rid){
     openModal(`<h3>${t('reject')}</h3><label class="f">${t('rejectWhy')}</label>
      ${['rj1','rj2','rj3','rj4'].map((k,i)=>`<label class="opt"><input type="radio" name="rj" value="${k}" ${i===0?'checked':''}> ${t(k)}</label>`).join('')}
      <div class="g2" style="margin-top:0.75rem"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn red" onclick="doReject(${tid},${rid})">${t('reject')}</button></div>`)
    }
    function doReject(tid,rid){const k=document.querySelector('input[name="rj"]:checked').value;const r=taskById(tid).responses.find(x=>x.id===rid);r.status='rejected';r.reason=t(k);closeModal();save();render()}
    function settleTask(id){
     const tk=taskById(id);if(!tk||tk.status==='settled')return;
     const rs=tk.responses,n=rs.length,r=tk.reward,info={lowSample:false,noConsensus:false};
     let win=[],lose=[];
     if(tk.mode==='review'){rs.forEach(x=>{if(x.status==='submitted')x.status='approved'});win=rs.filter(x=>x.status==='approved');lose=rs.filter(x=>x.status==='rejected')}
     else{
      let match=rs.map(()=>true);
      if(n<CONFIG.minConsensus)info.lowSample=true;
      else tk.questions.forEach(q=>{if(q.type!=='choice')return;let target=q.gold;
        if(!target){const c={};rs.forEach(x=>{c[x.answers[q.id]]=(c[x.answers[q.id]]||0)+1});const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(top&&top[1]/n>0.5)target=top[0];else info.noConsensus=true}
        if(target)rs.forEach((x,i)=>{if(x.answers[q.id]!==target)match[i]=false})});
      if(info.lowSample||info.noConsensus)match=rs.map(()=>true);
      rs.forEach((x,i)=>x.status=match[i]?'correct':'wrong');
      win=rs.filter(x=>x.status==='correct');lose=rs.filter(x=>x.status==='wrong')
     }
     const pool=r*n;let each=0,back=0;
     if(win.length)each=pool/win.length;else back=pool;
     win.forEach(x=>{if(x.user===state.me.username&&!x.paid){x.paid=true;addPending(each,tk)}x.amount=each});lose.forEach(x=>x.amount=0);
     const refund=(tk.max-n)*r+back;
     if(tk.requester===state.me.username&&refund>0){state.piBalance+=refund;state.history.unshift({k:'h_refund',amt:refund,note:ttl(tk),at:now()})}
     tk.status='settled';tk.settlement={each,winners:win.length,losers:lose.length,refund,...info};
     save();toast(t('settled'));render()
    }

    /* Wallet History Search, Date-Range Filter & Timestamps */
    function formatDateTime(ts){
      const d=new Date(ts||now());
      if(Number.isNaN(d.getTime()))return '';
      const pad=v=>String(v).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function formatDateInputValue(ts){
      const d=new Date(ts||now());
      if(Number.isNaN(d.getTime()))return '';
      const pad=v=>String(v).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }
    function getFilteredHistory(){
      const q=(state.histQuery||'').trim().toLowerCase();
      const rangeMode=state.histFilterMode==='range';
      const fromTs=rangeMode&&state.histFrom?new Date(state.histFrom+'T00:00:00').getTime():null;
      const toTs=rangeMode&&state.histTo?new Date(state.histTo+'T23:59:59.999').getTime():null;
      return (state.history||[]).filter(h=>{
        const ts=h.at||now();
        if(rangeMode){
          if(fromTs&&!Number.isNaN(fromTs)&&ts<fromTs)return false;
          if(toTs&&!Number.isNaN(toTs)&&ts>toTs)return false;
        }
        if(!q)return true;
        const label=t(h.k).toLowerCase();
        const note=String(h.note||'').toLowerCase();
        const amtStr=((h.amt>=0?'+':'')+fmt(h.amt)+' π').toLowerCase();
        const dtStr=formatDateTime(ts).toLowerCase();
        return label.includes(q)||note.includes(q)||amtStr.includes(q)||dtStr.includes(q)||String(h.k||'').toLowerCase().includes(q);
      });
    }
    function renderHistoryListHtml(){
      const list=getFilteredHistory();
      if(!list.length){
        return `<div class="small" style="text-align:center;padding:0.75rem 0.25rem">${t('noHistory')}</div>`;
      }
      return list.map(h=>{
        const amtText=(h.amt>=0?'+':'')+fmt(h.amt)+' π';
        const dtText=formatDateTime(h.at||now());
        return `<div class="hist-item">
          <div>
            <div class="hist-label">${esc(t(h.k))}${h.note?` <span class="small">· ${esc(h.note)}</span>`:''}</div>
            <div class="hist-time">🕒 ${esc(dtText)}</div>
          </div>
          <b class="hist-amt" style="color:${h.amt>=0?'var(--green)':'var(--red)'}">${esc(amtText)}</b>
        </div>`;
      }).join('');
    }
    function onHistorySearch(val){
      state.histQuery=val;
      save();
      const box=$('walletHistoryList');
      const cnt=$('walletHistoryCount');
      const clr=$('histSearchClear');
      if(clr)clr.style.display=val?'inline-flex':'none';
      if(box)box.innerHTML=renderHistoryListHtml();
      if(cnt)cnt.textContent=t('historyCount',getFilteredHistory().length);
    }
    function setHistoryFilterMode(mode){
      state.histFilterMode=mode;
      if(mode==='range'){
        if(!state.histFrom)state.histFrom=formatDateInputValue(now()-14*D);
        if(!state.histTo)state.histTo=formatDateInputValue(now());
      }
      save();
      render();
    }
    function onHistoryDateChange(){
      const f=$('histFromInput');
      const to=$('histToInput');
      if(f)state.histFrom=f.value;
      if(to)state.histTo=to.value;
      save();
      const box=$('walletHistoryList');
      const cnt=$('walletHistoryCount');
      if(box)box.innerHTML=renderHistoryListHtml();
      if(cnt)cnt.textContent=t('historyCount',getFilteredHistory().length);
    }
    function resetHistoryFilters(){
      state.histQuery='';
      state.histFilterMode='all';
      state.histFrom='';
      state.histTo='';
      save();
      render();
    }

    function vWallet(){
     const e=state.earn,min=CONFIG.minWithdraw,can=e.available>=min;
     const filtered=getFilteredHistory();
     const isRange=state.histFilterMode==='range';
     const hasQuery=Boolean((state.histQuery||'').trim());
     return `<div class="card"><div class="row"><div class="grow"><div class="small">${t('piWallet')}</div><div class="big pi">π ${fmt(state.piBalance)}</div></div><button class="btn p act" onclick="topupModal()">＋ ${t('topupTitle')}</button></div></div>
     <div class="card"><div class="row" style="margin-bottom:0.4rem"><h3 class="grow" style="margin:0">${t('earnings')}</h3><button class="btn p act" ${can?'':'disabled'} onclick="withdrawModal()">${t('withdraw')}</button></div><div class="g2"><div><div class="small">${t('avail')}</div><div class="big pi">π ${fmt(e.available)}</div></div><div><div class="small">${t('pend')}</div><div class="big" style="color:var(--mute)">π ${fmt(e.pending.reduce((s,p)=>s+p.amount,0))}</div></div></div>
      <p class="small">${t('wRule',min,CONFIG.holdDays,CONFIG.withdrawFeePct)}</p>
      ${can?'':`<div class="small" style="margin-top:0.35rem">${t('wMin',min)}</div>`}
      ${e.pending.map(p=>`<div class="kv"><span>${esc(p.note)}</span><span>π ${fmt(p.amount)} · ${t('releaseIn',remain(p.releaseAt))}</span></div>`).join('')}</div>
     <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:0.45rem">
        <h3 style="margin:0">${t('history')}</h3>
        <span id="walletHistoryCount" class="tag b">${t('historyCount',filtered.length)}</span>
      </div>
      <div class="hist-controls">
        <div class="search-wrap" style="margin-bottom:0">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="walletHistorySearch" class="search-in" type="search" value="${esc(state.histQuery||'')}" placeholder="${t('searchHistory')}" oninput="onHistorySearch(this.value)" />
          <button id="histSearchClear" type="button" class="search-clear" style="display:${hasQuery?'inline-flex':'none'}" onclick="onHistorySearch('');$('walletHistorySearch').value='';$('walletHistorySearch').focus()" aria-label="Clear">✕</button>
        </div>
        <div class="hist-filter-row">
          <div class="hist-mode-pills">
            <button type="button" class="hist-mode-btn ${!isRange?'on':''}" onclick="setHistoryFilterMode('all')">${t('allTime')}</button>
            <button type="button" class="hist-mode-btn ${isRange?'on':''}" onclick="setHistoryFilterMode('range')">${t('dateRange')}</button>
          </div>
          ${(hasQuery||isRange)?`<button type="button" class="btn sm line" onclick="resetHistoryFilters()">${t('clearFilter')}</button>`:''}
        </div>
        ${isRange?`<div class="hist-dates">
          <input id="histFromInput" class="hist-date-in" type="date" value="${esc(state.histFrom||'')}" aria-label="${t('fromDate')}" onchange="onHistoryDateChange()" />
          <input id="histToInput" class="hist-date-in" type="date" value="${esc(state.histTo||'')}" aria-label="${t('toDate')}" onchange="onHistoryDateChange()" />
          <button type="button" class="btn sm" onclick="resetHistoryFilters()">${t('allTime')}</button>
        </div>`:''}
      </div>
      <div id="walletHistoryList">${renderHistoryListHtml()}</div>
     </div>`
    }
    function topupModal(){
     openModal(`<h3>🟣 ${t('topupTitle')}</h3>
      <div class="chips" style="flex-wrap:wrap">${[1,5,10,20].map(v=>`<button class="chip" onclick="$('tpa').value=${v}">π ${v}</button>`).join('')}</div>
      <label class="f">${t('topupAmt')}</label><input class="in" id="tpa" type="number" min="0.1" max="100" step="0.1" value="5">
      <p class="small">${t('topupNote')}</p>
      <div class="g2"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn p" onclick="doTopup()">${t('topupTitle')}</button></div>`)
    }
    async function doTopup(){
     const a=+$('tpa').value;
     if(!(a>0)){toast(t('topupMin'));return}
     if(a>100){toast(t('topupMax'));return}
     closeModal();
     const ok=await PiLayer.pay(a,'RealTap top-up');
     if(!ok)return;
     state.piBalance+=a;state.history.unshift({k:'h_topup',amt:a,note:'Pi wallet',at:now()});save();toast(t('topupDone',fmt(a)));render()
    }
    function wCalc(a){const fee=a*CONFIG.withdrawFeePct/100;return{fee,net:a-fee}}
    function updWd(){const a=+$('wa').value||0,c=wCalc(a);$('wfee').textContent='π '+fmt(c.fee);$('wnet').textContent='π '+fmt(c.net)}
    function withdrawModal(){
     openModal(`<h3>${t('withdraw')}</h3><label class="f">${t('wAmt')}</label><input class="in" id="wa" type="number" step="0.01" min="${CONFIG.minWithdraw}" max="${fmt(state.earn.available)}" value="${fmt(state.earn.available)}" oninput="updWd()">
      <div class="card" style="margin:0.6rem 0;background:var(--surface-alt)"><div class="kv"><span>${t('wFee',CONFIG.withdrawFeePct)}</span><b id="wfee"></b></div><div class="kv"><span>${t('wNet')}</span><b class="pi" id="wnet"></b></div></div>
      <p class="small">${t('wRule',CONFIG.minWithdraw,CONFIG.holdDays,CONFIG.withdrawFeePct)}</p>
      <div class="g2"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn p" onclick="doWithdraw()">${t('wSend')}</button></div>`);updWd()
    }
    async function doWithdraw(){
     const a=+$('wa').value;
     if(!(a>=CONFIG.minWithdraw)||a>state.earn.available+1e-9){toast(t('wMin',CONFIG.minWithdraw));return}
     const c=wCalc(a);
     closeModal();await PiLayer.payout(c.net);
     state.earn.available-=a;state.history.unshift({k:'h_withdraw',amt:-a,note:'Fee π '+fmt(c.fee)+' · Received π '+fmt(c.net),at:now()});save();toast(t('wDone'));render()
    }

    function vMe(){
     const m=state.me,lo=Object.keys(LN).filter(l=>l!=='any');
     return `<div class="card"><div class="row">${kindBadge3d('avatar')}<div class="grow"><div class="title">@${esc(m.username)}</div><span class="tag g">✓ ${t('kycOk')}</span></div></div></div>
     <div class="card">
      <label class="f" style="margin-top:0">${t('uiLang')}</label><select class="in" id="uil" onchange="setLang(this.value)">${Object.entries(UILANG).map(([k,v])=>`<option value="${k}" ${state.lang===k?'selected':''}>${v}</option>`).join('')}</select>
      <label class="f">${t('themeColor')}</label><div class="swrow" id="swrow"><button class="sw cur" id="swcur" style="background:linear-gradient(145deg,${THEMES[state.theme].a1},${THEMES[state.theme].a2})" onclick="toggleSw()" aria-label="${t('themeColor')}"></button><span class="swarrow">›</span><div class="swpanel">${Object.entries(THEMES).map(([k,v])=>`<button class="sw ${state.theme===k?'on':''}" data-k="${k}" style="background:linear-gradient(145deg,${v.a1},${v.a2})" onclick="setTheme('${k}')" aria-label="${t('th_'+k)}"></button>`).join('')}</div></div>
      <label class="f">${t('textSize')}</label><div class="seg" style="margin-bottom:0">${['s','m','l'].map(s=>`<button class="${state.fs===s?'on':''}" onclick="setFs('${s}')">${t('fs_'+s)}</button>`).join('')}</div></div>
     <div class="card">
      <label class="f" style="margin-top:0">${t('myCountry')}</label><select class="in" onchange="state.me.country=this.value;save()">${Object.keys(CN).filter(c=>c!=='ANY').map(c=>`<option value="${c}" ${m.country===c?'selected':''}>${flag(c)} ${cname(c)}</option>`).join('')}</select>
      <label class="f">${t('mainLang')}</label><select class="in" onchange="state.me.lang=this.value;save()">${lo.map(l=>`<option value="${l}" ${m.lang===l?'selected':''}>${lname(l)}</option>`).join('')}</select>
      <label class="f">${t('secondLang')}</label><select class="in" onchange="state.me.lang2=this.value;save()"><option value="">${t('none')}</option>${lo.map(l=>`<option value="${l}" ${m.lang2===l?'selected':''}>${lname(l)}</option>`).join('')}</select>
      <p class="small" style="margin:0.5rem 0 0">${t('langWhy')}</p></div>
     <details><summary>${t('privacy')}</summary><div class="card small">${t('privacyNote')}<br><br>${t('privacyBody')}</div></details>
     <details><summary>${t('rulesTitle')}</summary><div class="card small">${['r1','r2','r3','r4','r5'].map(r=>'• '+t(r)).join('<br>')}</div></details>
     <details><summary>${t('demo')}</summary><div class="card"><button class="btn full" onclick="ffwd()">${t('ffwd')}</button>
      <button class="btn full" style="margin-top:0.5rem" onclick="settleMine()">${t('settleMine')}</button>
      <button class="btn full" style="margin-top:0.5rem" onclick="topup()">${t('topup')}</button>
      <button class="btn red full" style="margin-top:0.5rem" onclick="resetDemo()">${t('reset')}</button></div></details>`
    }
    function topup(){state.piBalance+=10;state.history.unshift({k:'h_topup',amt:10,note:'Demo top-up',at:now()});save();toast('+π 10');render()}
    function ffwd(){state.timeOffset+=3*D;releasePending();save();toast(t('ffDone'));render()}
    function settleMine(){state.tasks.filter(tk=>myResp(tk)&&tk.status!=='settled'&&tk.mode==='consensus').forEach(tk=>settleTask(tk.id));toast(t('settledMine'));render()}
    function resetDemo(){const l=state.lang,f=state.fs;state=seed();state.lang=l;state.fs=f;save();render()}

    applyPrefs();
    render();
  </script>
</body>
