with open('base_realtap.html', 'w', encoding='utf-8') as f:
    f.write(r'''<!DOCTYPE html>
<html lang="en" class="fs-m">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealTap — Mini App Bottom Sheet UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --a1:#111111;--a2:#18181b;--a3:#09090b;--accent-rgb:17,17,17;
      --bg:#111214;
      --chrome-bg:#16171a;
      --chrome-ink:#ffffff;
      --chrome-sub:#a1a1aa;
      --chrome-pill:#23252a;
      --chrome-line:rgba(255,255,255,0.12);
      --sheet-bg:#ffffff;
      --surface:#ffffff;
      --surface-solid:#ffffff;
      --surface-alt:#f8fafc;
      --ink:#111111;
      --sub:#52525b;
      --mute:#71717a;
      --line:#e4e4e7;
      --line-soft:#f4f4f5;
      --accent:#111111;
      --accent-2:#16a34a;
      --accent-soft:#f4f4f5;
      --pi:#16a34a;
      --pi-soft:#f0fdf4;
      --green:#16a34a;
      --green-soft:#dcfce7;
      --red:#dc2626;
      --red-soft:#fee2e2;
      --yellow:#d97706;
      --yellow-soft:#fef3c7;
      --shadow-3d:none;
      --shadow-btn:none;
      --font-display:'Plus Jakarta Sans','Inter','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
      --font-body:'Inter','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,Roboto,'Helvetica Neue','Apple SD Gothic Neo','Noto Sans KR','Noto Sans SC',sans-serif;
    }

    html.dark-sheet {
      --sheet-bg:#0a0b0d;
      --surface:#121317;
      --surface-solid:#121317;
      --surface-alt:#181a20;
      --ink:#f9fafb;
      --sub:#a1a1aa;
      --mute:#71717a;
      --line:#24272e;
      --line-soft:#191b20;
      --accent:#ffffff;
      --accent-soft:#1f2229;
      --pi:#22c55e;
      --pi-soft:rgba(34,197,94,0.14);
      --green:#22c55e;
      --green-soft:rgba(34,197,94,0.16);
      --red:#f87171;
      --red-soft:rgba(248,113,113,0.15);
      --yellow:#fbbf24;
      --yellow-soft:rgba(251,191,36,0.15);
    }

    html.fs-s { font-size: 11.5px; }
    html.fs-m { font-size: 13px; }
    html.fs-l { font-size: 15.5px; }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-body);
    }

    body {
      margin: 0;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.06), transparent 45%),
        #0b0c0e;
      min-height: 100vh;
    }

    .preview-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.85rem 0.75rem 1.5rem;
      gap: 0.8rem;
    }

    .preview-toolbar {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.6rem 0.85rem;
      border-radius: 1rem;
      background: #16171a;
      border: 1px solid #27292f;
      color: #ffffff;
    }

    .viewport-stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: all 0.22s ease;
    }

    .viewport-stage.mode-mobile #phone {
      width: 100%;
      max-width: 416px;
      height: 820px;
      max-height: calc(100vh - 5.2rem);
      border-radius: 2.3rem;
      border: 5px solid #23252a;
    }

    .viewport-stage.mode-responsive #phone {
      width: 100%;
      max-width: 820px;
      height: 820px;
      max-height: calc(100vh - 5.2rem);
      border-radius: 1.5rem;
      border: 1px solid #27292f;
    }

    /* Mini App / In-App Browser Outer Container */
    #phone {
      position: relative;
      background: var(--chrome-bg);
      color: var(--chrome-ink);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: max-width 0.22s ease, border-radius 0.22s ease, background-color 0.2s ease;
    }

    /* Top Mini App / In-App Browser Chrome */
    .proto-bar {
      background: #111214;
      color: var(--chrome-sub);
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.3rem 0.8rem;
      text-align: center;
      letter-spacing: -0.01em;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    #hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.68rem 0.95rem 0.9rem;
      background: var(--chrome-bg);
      color: var(--chrome-ink);
      flex-shrink: 0;
      z-index: 15;
    }

    .chrome-icon-btn {
      width: 2.15rem;
      height: 2.15rem;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--chrome-ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 500;
      flex-shrink: 0;
      transition: background-color 0.15s ease;
    }

    .chrome-icon-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .miniapp-switcher {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.34rem 0.72rem 0.34rem 0.4rem;
      border-radius: 0.75rem;
      background: var(--chrome-pill);
      border: 1px solid var(--chrome-line);
      color: var(--chrome-ink);
      font-size: 0.84rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      max-width: 15rem;
    }

    .miniapp-switcher span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .miniapp-chev {
      font-size: 0.72rem;
      color: var(--chrome-sub);
      margin-left: 0.08rem;
    }

    /* Bottom Sheet Body Container */
    .bottom-sheet-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--sheet-bg);
      color: var(--ink);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      margin-top: -0.25rem;
      overflow: hidden;
      position: relative;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #main {
      flex: 1;
      overflow-y: auto;
      padding: 0.9rem 1rem 4.6rem;
      scroll-behavior: smooth;
    }

    /* Sheet Hero Header Row (Metric/Title left + Pill Action right) */
    .sheet-hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      margin-bottom: 0.75rem;
    }

    .sheet-hero-title {
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--ink);
      margin: 0;
      font-variant-numeric: tabular-nums;
    }

    .sheet-hero-sub {
      font-size: 0.75rem;
      color: var(--mute);
      margin-top: 0.2rem;
    }

    .sheet-pill-action {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.44rem 0.9rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .sheet-pill-action:hover {
      background: var(--surface-alt);
      border-color: var(--mute);
    }

    .emblem-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 1.25rem;
      height: 1.25rem;
    }

    .emblem-3d svg { width: 100%; height: 100%; }

    /* Left rounded-square icon with bottom-right badge */
    .ico-3d {
      width: 2.65rem;
      height: 2.65rem;
      border-radius: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      border: 1px solid var(--line);
    }

    .ico-3d svg { width: 1.3rem; height: 1.3rem; }
    .ico-3d.kind-apptest { background: #18181b; border-color: #27272a; }
    .ico-3d.kind-apptest svg path,
    .ico-3d.kind-apptest svg rect { stroke: #ffffff; }
    .ico-3d.kind-survey { background: #fef3c7; border-color: #fde68a; }
    .ico-3d.kind-verify { background: #dcfce7; border-color: #bbf7d0; }
    .ico-3d.kind-avatar { background: #f4f4f5; border-color: #e4e4e7; overflow: hidden; }

    html.dark-sheet .ico-3d.kind-apptest { background: #27272a; border-color: #3f3f46; }
    html.dark-sheet .ico-3d.kind-survey { background: rgba(251, 191, 36, 0.16); border-color: rgba(251, 191, 36, 0.3); }
    html.dark-sheet .ico-3d.kind-verify { background: rgba(34, 197, 94, 0.16); border-color: rgba(34, 197, 94, 0.3); }
    html.dark-sheet .ico-3d.kind-avatar { background: #1f2229; border-color: #2e323c; }

    .ico-subbadge {
      position: absolute;
      right: -0.22rem;
      bottom: -0.22rem;
      width: 1.05rem;
      height: 1.05rem;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-size: 0.56rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .avatar-lg {
      width: 3.3rem;
      height: 3.3rem;
      border-radius: 1rem;
      border: 1px solid var(--line);
      background: var(--surface-alt);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .avatar-lg img, .ico-3d.kind-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Search Bar */
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      margin-bottom: 0.65rem;
    }

    .search-ico {
      position: absolute;
      left: 0.85rem;
      width: 0.92rem;
      height: 0.92rem;
      color: var(--mute);
      pointer-events: none;
    }

    .search-in {
      width: 100%;
      padding: 0.52rem 2.2rem 0.52rem 2.3rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 0.82rem;
      font-family: var(--font-body);
      transition: border-color 0.15s ease;
    }

    .search-in:focus {
      outline: none;
      border-color: var(--ink);
    }

    .search-clear {
      position: absolute;
      right: 0.55rem;
      width: 1.35rem;
      height: 1.35rem;
      border: 0;
      border-radius: 999px;
      background: var(--line-soft);
      color: var(--sub);
      font-size: 0.72rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Wallet History Controls */
    .hist-controls {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      margin-bottom: 0.55rem;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .hist-filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .hist-mode-pills {
      display: inline-flex;
      gap: 0.3rem;
    }

    .hist-mode-btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.32rem 0.7rem;
      border-radius: 999px;
      cursor: pointer;
    }

    .hist-mode-btn.on {
      background: var(--ink);
      color: var(--sheet-bg);
      border-color: var(--ink);
    }

    .hist-dates {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 0.35rem;
      align-items: center;
      margin-top: 0.1rem;
    }

    .hist-date-in {
      width: 100%;
      padding: 0.38rem 0.5rem;
      border-radius: 0.75rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      font-size: 0.74rem;
    }

    .hist-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--line-soft);
    }

    .hist-item:last-child { border-bottom: 0; padding-bottom: 0.2rem; }
    .hist-label { font-size: 0.88rem; font-weight: 600; color: var(--ink); line-height: 1.28; letter-spacing: -0.01em; }
    .hist-time { font-size: 0.72rem; color: var(--mute); margin-top: 0.16rem; font-variant-numeric: tabular-nums; }
    .hist-amt { font-size: 0.86rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* Clean Flat List Rows & Section Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1rem;
      padding: 0.8rem 0.9rem;
      margin-bottom: 0.65rem;
    }

    .card.task {
      cursor: pointer;
      position: relative;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-soft);
      border-radius: 0;
      padding: 0.72rem 0.15rem;
      margin-bottom: 0;
    }

    .card.task:last-child {
      border-bottom: 0;
    }

    .card.task.compact {
      padding: 0.72rem 0.12rem;
      margin-bottom: 0;
      border-radius: 0;
    }

    .card.task.compact .ico-3d { width: 2.65rem; height: 2.65rem; border-radius: 0.75rem; }
    .card.task.compact .ico-3d svg { width: 1.25rem; height: 1.25rem; }
    .card.task.compact .title {
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.28;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card.task.compact .meta {
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 0.2rem;
      line-height: 1.28;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card.task.compact .reward { padding: 0.24rem 0.55rem; border-radius: 999px; }
    .card.task.compact .reward b { font-size: 0.78rem; }
    .card.task.compact .heart { padding: 0.26rem 0.38rem; font-size: 0.82rem; border-radius: 999px; background: transparent; border-color: transparent; }

    .card.task:hover {
      background: var(--surface-alt);
    }

    .card.task:active { opacity: 0.88; }
    .card h3 {
      font-family: var(--font-display);
      margin: 0 0 0.48rem;
      font-size: 0.94rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--ink);
    }

    .row-chev {
      color: var(--mute);
      font-size: 1rem;
      font-weight: 500;
      flex-shrink: 0;
      margin-left: 0.1rem;
    }

    .row { display: flex; align-items: center; gap: 0.72rem; }
    .grow { flex: 1; min-width: 0; }
    .title { font-family: var(--font-display); font-weight: 700; font-size: 0.92rem; line-height: 1.3; letter-spacing: -0.015em; color: var(--ink); }
    .meta { font-size: 0.76rem; color: var(--sub); margin-top: 0.2rem; line-height: 1.32; }
    .small { font-size: 0.76rem; color: var(--sub); line-height: 1.42; }
    .big { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
    .pi { color: var(--green); font-weight: 700; font-variant-numeric: tabular-nums; }

    .reward {
      text-align: right;
      background: var(--green-soft);
      padding: 0.24rem 0.58rem;
      border-radius: 999px;
      border: 0;
      flex-shrink: 0;
    }

    .reward b { display: block; color: var(--green); font-size: 0.78rem; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .reward small { color: var(--sub); font-size: 0.66rem; }

    .heart {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 999px;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0.28rem 0.4rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 0.32rem; margin-top: 0.52rem; }
    .tag {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0.16rem 0.52rem;
      border-radius: 999px;
      background: var(--surface-alt);
      color: var(--sub);
      border: 1px solid var(--line);
    }

    .tag.inline-tag { font-size: 0.64rem; padding: 0.06rem 0.42rem; margin-left: 0.3rem; vertical-align: middle; border: 0; }
    .tag.b { background: var(--surface-alt); color: var(--ink); border: 1px solid var(--line); }
    .tag.g { background: var(--green-soft); color: var(--green); border: 0; }
    .tag.r { background: var(--red-soft); color: var(--red); border: 0; }
    .tag.y { background: var(--yellow-soft); color: var(--yellow); border: 0; }

    /* Segmented & Lift Pill Chips */
    .seg {
      display: flex;
      gap: 0.35rem;
      background: transparent;
      border: 0;
      padding: 0;
      margin-bottom: 0.55rem;
      flex-wrap: wrap;
    }

    .seg button {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 0.38rem 0.82rem;
      border-radius: 999px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: -0.01em;
      color: var(--ink);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .seg button.on {
      background: var(--ink);
      color: var(--sheet-bg);
      border-color: var(--ink);
    }

    .chips {
      display: flex;
      gap: 0.42rem;
      overflow-x: auto;
      padding-bottom: 0.38rem;
      margin-bottom: 0.45rem;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }

    .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 0.42rem 0.88rem;
      border-radius: 999px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .chip.on {
      background: var(--ink);
      color: var(--sheet-bg);
      border-color: var(--ink);
    }

    /* Flat Buttons */
    .btn {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      padding: 0.58rem 0.85rem;
      border-radius: 999px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 0.84rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    .btn:hover:not(:disabled) { opacity: 0.9; background: var(--surface-alt); }
    .btn:disabled { opacity: 0.42; cursor: not-allowed; }

    .btn.p {
      background: var(--ink);
      color: var(--sheet-bg);
      border-color: var(--ink);
    }

    .btn.g {
      background: #16a34a;
      color: #ffffff;
      border-color: transparent;
    }

    .btn.red {
      background: #dc2626;
      color: #ffffff;
      border-color: transparent;
    }

    .btn.line {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .btn.sm { padding: 0.36rem 0.68rem; font-size: 0.75rem; border-radius: 999px; }
    .btn.full { width: 100%; }

    .back {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 0.36rem 0.76rem;
      border-radius: 999px;
      margin-bottom: 0.6rem;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
      padding: 0.36rem 0;
      font-size: 0.84rem;
    }

    hr { border: 0; border-top: 1px solid var(--line-soft); margin: 0.55rem 0; }

    .note {
      padding: 0.62rem 0.78rem;
      border-radius: 0.85rem;
      font-size: 0.78rem;
      line-height: 1.45;
      background: var(--surface-alt);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .note.warn { background: var(--yellow-soft); border-color: transparent; color: var(--ink); }
    .note.err { background: var(--red-soft); border-color: transparent; color: var(--red); }

    function setViewportMode(mode) {
      $('viewportStage').className = 'viewport-stage ' + (mode === 'mobile' ? 'mode-mobile' : 'mode-responsive');

    function setSheetMode(mode) {
      state.sheetMode = mode === 'dark' ? 'dark' : 'light';
      save();
      applyPrefs();
      updateSheetModeButtons();

    function updateSheetModeButtons() {
      const isDark = state.sheetMode === 'dark';
      const lBtn = $('sheetModeLightBtn');
      const dBtn = $('sheetModeDarkBtn');
      if (lBtn) lBtn.className = 'vp' + (!isDark ? ' on' : '');
      if (dBtn) dBtn.className = 'vp' + (isDark ? ' on' : '');

    function copyUpdatedSource() {
      const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      let copied = false;
      try {
        const ta = document.createElement('textarea');
        ta.value = htmlContent;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        copied = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (e) {
        copied = false;
      }
      toast(copied ? 'Copied updated index.html!' : 'Copy failed — use editor code.');
    }

    let state=load();
    function load(){
      try{
        const s=localStorage.getItem('realtap-human-v6');
        if(s){
          const parsed=JSON.parse(s);
          if(typeof parsed.search!=='string')parsed.search='';if(!parsed.theme)parsed.theme='indigo';
          if(!parsed.sheetMode)parsed.sheetMode='light';
          if(!Array.isArray(parsed.saved))parsed.saved=[];
          if(!Array.isArray(parsed.recent))parsed.recent=[];
          if(!parsed.meListView)parsed.meListView=null;
          if(!parsed.me)parsed.me={};
          if(!parsed.me.nickname)parsed.me.nickname=parsed.me.username||'pioneer_kim';
          if(!parsed.me.avatarPreset)parsed.me.avatarPreset='🙂';
          if(typeof parsed.me.avatarData!=='string')parsed.me.avatarData='';
          if(!parsed.me.region)parsed.me.region='ANY';
          if(!parsed.me.gender)parsed.me.gender='any';
          if(!parsed.me.ageGroup)parsed.me.ageGroup='any';
          if(typeof parsed.me.lastCountryChange!=='number')parsed.me.lastCountryChange=0;
          if(typeof parsed.me.lastRegionChange!=='number')parsed.me.lastRegionChange=0;
          if(typeof parsed.me.genderLocked!=='boolean')parsed.me.genderLocked=false;
          if(typeof parsed.me.ageLocked!=='boolean')parsed.me.ageLocked=false;
          if(typeof parsed.histQuery!=='string')parsed.histQuery='';
          if(!parsed.histFilterMode)parsed.histFilterMode='all';
          if(typeof parsed.histFrom!=='string')parsed.histFrom='';
          if(typeof parsed.histTo!=='string')parsed.histTo='';
          return parsed;
        }
      }catch(e){}
      return seed();
    }

          <div class="card" style="margin:0.75rem 0;background:var(--surface-alt)"><div class="big pi">π ${fmt(amount)}</div><div class="small">${esc(memo)}</div></div>
          <div class="g2"><button class="btn" id="pc">${t('cancel')}</button><button class="btn p" id="po">${t('piConfirm')}</button></div>`);
        $('pc').onclick=()=>{closeModal();res(false)};

    function view(v){state.view=v;save();render();$('main').scrollTop=0}
    function recordRecent(id){
      if(!Array.isArray(state.recent))state.recent=[];
      state.recent=[id,...state.recent.filter(x=>x!==id)].slice(0,20);
    }
    function openTask(id,from){
      recordRecent(id);
      state.tab='explore';
      state.from=from||null;
      view({name:'task',id});
    }
    function openReview(id){state.tab='activity';state.view={name:'review',id};save();render();$('main').scrollTop=0}
    function goBack(){const f=state.from;state.from=null;state.view=null;if(f)state.tab=f;save();render()}
    function releasePending(){const a=state.earn;const keep=[];a.pending.forEach(p=>{if(p.releaseAt<=now())a.available+=p.amount;else keep.push(p)});a.pending=keep}
    const taskById=id=>state.tasks.find(x=>x.id===id);
    const myResp=tk=>tk.responses.find(r=>r.user===state.me.username);
    function eligible(tk){
     const m=state.me;
     if(tk.requester===m.username)return{ok:false,msg:t('isMine')};
     if(myResp(tk))return{ok:false,msg:t('alreadyDone')};
     if(tk.status==='settled')return{ok:false,msg:t('isSettled')};
     if(tk.status==='paused')return{ok:false,msg:t('isPaused')};
     if(tk.responses.length>=tk.max)return{ok:false,msg:t('isFull')};
     if(tk.country!=='ANY'&&tk.country!==m.country)return{ok:false,msg:t('needCountry',cname(tk.country))};
     if(tk.region&&tk.region!=='ANY'&&m.region&&m.region!=='ANY'&&tk.region!==m.region)return{ok:false,msg:t('needRegion',rname(tk.country!=='ANY'?tk.country:m.country,tk.region))};
     if(tk.gender&&tk.gender!=='any'&&m.gender!==tk.gender)return{ok:false,msg:t('needGender',gname(tk.gender))};
     if(tk.ageGroup&&tk.ageGroup!=='any'&&m.ageGroup!==tk.ageGroup)return{ok:false,msg:t('needAge',agename(tk.ageGroup))};
     if(tk.kind==='apptest'&&tk.targetOs&&tk.targetOs!=='any'){
       const env=detectClientEnv();
       if(tk.targetOs!==env.os)return{ok:false,msg:t('needOs',t('os_'+tk.targetOs),env.osLabel)};
     }
     return{ok:true}
    }

    function badges(tk,inline=false){
     const cls=inline?'tag inline-tag':'tag';
     const b=[`<span class="${cls} b">${t('k_'+tk.kind)}</span>`];
     if(tk.kind==='apptest'&&tk.appVersion)b.push(`<span class="${cls}">${esc(tk.appVersion)}</span>`);
     if(tk.kind==='apptest'&&tk.targetOs&&tk.targetOs!=='any')b.push(`<span class="${cls} b">${t('os_'+tk.targetOs)}</span>`);
     if(tk.region&&tk.region!=='ANY')b.push(`<span class="${cls}">${esc(rname(tk.country,tk.region))}</span>`);
     if(tk.gender&&tk.gender!=='any')b.push(`<span class="${cls}">${esc(gname(tk.gender))}</span>`);
     if(tk.ageGroup&&tk.ageGroup!=='any')b.push(`<span class="${cls}">${esc(agename(tk.ageGroup))}</span>`);
     if(!inline&&tk.mode==='consensus')b.push(`<span class="${cls}">${t('modeC').split(' — ')[0]}</span>`);
     if(tk.sensitive)b.push(`<span class="${cls} r">⚠ ${t('sensitive')}</span>`);
     if(tk.status==='paused')b.push(`<span class="${cls} y">${t('underReview')}</span>`);
     if(tk.status==='settled')b.push(`<span class="${cls}">${t('finished')}</span>`);
     if(tk.requester===state.me.username)b.push(`<span class="${cls} g">${t('yours')}</span>`);
     else if(myResp(tk))b.push(`<span class="${cls} g">✓ ${t('done')}</span>`);
     else if(!eligible(tk).ok&&tk.status==='open'&&tk.responses.length<tk.max)b.push(`<span class="${cls} y">${t('locked')}</span>`);
     return b.join('')
    }

     return `<div class="card task compact" onclick="openTask(${tk.id})"><div class="row">${kindBadge3d(tk.kind)}

      <span class="row-chev" aria-hidden="true">›</span></div></div>`
    }

    function handleBugShot(qid,input){
      const file=input.files&&input.files[0];
      if(!file)return;
      const reader=new FileReader();
      reader.onload=e=>{
        const prev=$('shot_prev_'+qid);
        const hidden=$('shot_data_'+qid);
        if(hidden)hidden.value=e.target.result;
        if(prev){
          prev.innerHTML=`<div class="small" style="color:var(--green);font-weight:700;margin-top:0.35rem">✓ ${t('shotAttached')} (${esc(file.name)})</div><img class="shot-thumb" src="${e.target.result}" alt="Screenshot preview" />`;
        }
      };
      reader.readAsDataURL(file);
    }

     if(q.type==='choice'){
      if(q.inline){
        const pills=`<div class="pills">${q.options.map(o=>`<label class="${o==='problem'?'pr':''}"><input type="radio" name="a_${q.id}" value="${esc(o)}" onchange="onCheckChoiceChange('${q.id}',this.value)">${esc(optLabel(o))}</label>`).join('')}</div>`;
        if(!withBugDrawer)return pills;
        return `${pills}
          <div id="prob_drawer_${q.id}" class="problem-drawer" style="display:none">
            <div class="small" style="font-weight:800;color:var(--red)">${t('bugSeverity')}</div>

              <label class="sev-blocker"><input type="radio" name="sev_${q.id}" value="blocker">${t('sev_blocker').split(' (')[0]}</label>

              <label class="sev-minor"><input type="radio" name="sev_${q.id}" value="minor">${t('sev_minor').split(' (')[0]}</label>
            </div>
            <input class="in" style="margin-top:0.42rem;font-size:0.8rem" id="bnote_${q.id}" placeholder="${t('bugNotePh')}" />

          </div>`;
      }
      return q.options.map(o=>`<label class="opt"><input type="radio" name="a_${q.id}" value="${esc(o)}"> ${esc(optLabel(o))}</label>`).join('')}
     if(q.type==='rating')return `<div class="stars">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="a_${q.id}" value="${n}">${n}</label>`).join('')}</div>`;
     return `<textarea class="in" name="a_${q.id}" placeholder="${t('yourAnswer')}"></textarea>`
    }
    function submitAnswer(id){
     const tk=taskById(id);if(!tk||!eligible(tk).ok)return;
     if(tk.sensitive&&!$('consent').checked){toast(t('needConsent'));return}
     if(tk.kind==='apptest'&&tk.steps&&tk.steps.length){
       const stepBoxes=[...document.querySelectorAll('.step-chk')];
       if(stepBoxes.some(cb=>!cb.checked)){toast(t('completeAllSteps'));return}
     }
     const ans={},bugDetails={};
     for(const q of tk.questions){
      let v='';
      if(q.type==='choice'||q.type==='rating'){const c=document.querySelector(`input[name="a_${q.id}"]:checked`);v=c?c.value:''}
      else v=document.querySelector(`textarea[name="a_${q.id}"]`).value.trim();
      if(!v&&!q.optional){toast(t('answerAll'));return}
      ans[q.id]=v;
      if(v==='problem'){
        const sevEl=document.querySelector(`input[name="sev_${q.id}"]:checked`);
        const noteEl=$('bnote_'+q.id);
        const shotEl=$('shot_data_'+q.id);
        bugDetails[q.id]={
          severity:sevEl?sevEl.value:'major',
          note:noteEl?noteEl.value.trim():'',
          shot:shotEl?shotEl.value:'',
          hasShot:Boolean(shotEl&&shotEl.value)
        };
      }
     }
     const env=detectClientEnv();
     const r={id:Date.now(),user:state.me.username,env:env.summary,answers:ans,bugDetails,status:'submitted',reason:'',amount:0,paid:false,at:Date.now()};
     if(tk.mode==='review'&&tk.autoApprove){r.status='approved';r.amount=tk.reward;r.paid=true;addPending(tk.reward,tk)}
     tk.responses.push(r);save();toast(t('submitted'));state.tab='activity';state.seg='done';state.view=null;state.from=null;render()
    }
    function addPending(amount,tk){state.earn.pending.push({amount,releaseAt:now()+CONFIG.holdDays*D,note:ttl(tk)});state.history.unshift({k:'h_earn',amt:amount,note:ttl(tk),at:now()})}

    function sendReport(id){
     const tk=taskById(id),reason=document.querySelector('input[name="rp"]:checked').value;
     if(!state.reports.some(r=>r.taskId===id&&r.user===state.me.username))state.reports.push({taskId:id,user:state.me.username,reason,note:$('rpn').value});
     const uniq=new Set(state.reports.filter(r=>r.taskId===id).map(r=>r.user)).size;

     if(uniq>=CONFIG.reportsToPause&&tk.status==='open'){tk.status='paused';toast(t('rpPaused'))}else toast(t('rpDone'));
     save();render()
    }

      <div><label class="f">${t('deadline')}</label><select class="in" onchange="setDraft('hours',+this.value)">${opts([[24,t('hrs',24)],[48,t('hrs',48)],[72,t('days',3)],[168,t('days',7)]],d.hours)}</select></div></div>
      <label class="opt"><input type="checkbox" ${d.sensitive?'checked':''} onchange="setDraft('sensitive',this.checked)"> ${t('sensFlag')}</label></div></details>

      <details><summary>${t('rulesTitle')}</summary><div class="small">${['r1','r2','r3','r4','r5'].map(r=>'• '+t(r)).join('<br>')}</div></details></div>

    function optInputs(q,i){return q.options.map((o,j)=>`<div class="row" style="margin-top:0.35rem"><input class="in" value="${esc(o)}" placeholder="${t('optPh')} ${j+1}" oninput="state.draft.questions[${i}].options[${j}]=this.value"><button class="btn sm" onclick="state.draft.questions[${i}].options.splice(${j},1);render()">✕</button></div>`).join('')}
    function qBuilder(q,i){
     return `<div class="q"><div class="row" style="margin-bottom:0.45rem"><select class="in" style="width:auto" onchange="changeQType(${i},this.value)">${['choice','text','rating'].map(ty=>`<option value="${ty}" ${q.type===ty?'selected':''}>${qTypeLabel({type:ty})}</option>`).join('')}</select>
      <div class="grow"></div><button class="btn sm" onclick="delQ(${i})">✕</button></div>

      ${q.type==='choice'?`${optInputs(q,i)}<button class="btn sm line" style="margin-top:0.35rem" onclick="state.draft.questions[${i}].options.push('');render()">${t('addOpt')}</button>`:''}</div>`

    function toggleCheck(c,on){const a=state.draft.checks;if(on&&!a.includes(c))a.push(c);if(!on)state.draft.checks=a.filter(x=>x!==c);updateSummary()}
    function addQ(){state.draft.questions.push({type:'text',text:'',options:[]});render()}
    function delQ(i){state.draft.questions.splice(i,1);render()}
    function changeQType(i,ty){const q=state.draft.questions[i];q.type=ty;if(ty==='choice'&&q.options.length<2)q.options=['',''];render()}
    function setDraft(k,v,rerender){state.draft[k]=v;if(k==='mode'&&v==='consensus'){state.draft.autoApprove=false;if(state.draft.max<CONFIG.minConsensus)state.draft.max=CONFIG.minConsensus}
     if(rerender)render();else updateSummary()}
    function totals(d){const pool=d.reward*d.max,fee=pool*CONFIG.feePct/100;return{pool,fee,total:pool+fee}}
    function updateSummary(){
     const d=state.draft,tt=totals(d);if(!$('summary'))return;
     $('summary').innerHTML=`<div class="kv"><span>${t('escrow')}</span><b>π ${fmt(tt.pool)}</b></div>${CONFIG.feePct>0?`<div class="kv"><span>${t('fee',CONFIG.feePct)}</span><b>π ${fmt(tt.fee)}</b></div>`:''}<hr><div class="kv"><span>${t('total')}</span><b class="pi" style="font-size:1.15rem">π ${fmt(tt.total)}</b></div><div class="small">${t('balance')}: π ${fmt(state.piBalance)} · ${t('escrowNote')}</div>`;
     $('payb').textContent=t('payBtn',fmt(tt.total));
     $('sugg').textContent=t('suggestMin',fmt(suggestMin(d)))
    }
    function validate(d){
     const e=[],tt=totals(d);
     if(d.kind==='apptest'){
       if(!d.appName.trim())e.push(t('e_name'));
       if(!/^https?:\/\/\S+\.\S+/i.test(d.appUrl.trim()))e.push(t('e_url'));
       if(!d.checks.length&&!d.customChecks.some(x=>x.trim()))e.push(t('e_checks'));
     }
     else{
      if(d.kind==='survey'&&!d.title.trim())e.push(t('e_title'));
      if(!d.questions.length)e.push(t('e_q'));
      if(d.questions.some(q=>!q.text.trim()))e.push(t('e_qtext'));
      if(d.questions.some(q=>q.type==='choice'&&q.options.filter(o=>o.trim()).length<2))e.push(t('e_opts'));
     }
     if(d.mode==='consensus'&&d.max<CONFIG.minConsensus)e.push(t('e_min',CONFIG.minConsensus));
     if(d.reward<suggestMin(d)-1e-9)e.push(t('e_reward'));
     if(tt.total>state.piBalance+1e-9)e.push(t('e_bal'));
     if(!d.ack)e.push(t('e_rules'));
     const text=(d.appName+' '+d.title+' '+d.desc+' '+d.steps.join(' ')+' '+d.customChecks.join(' ')+' '+d.questions.map(q=>q.text).join(' ')).toLowerCase();
     if(BANNED.some(b=>text.includes(b)))e.push(t('e_banned'));
     return e
    }
    async function publishDraft(){
     const d=state.draft;d.errors=validate(d);
     if(d.errors.length){render();$('main').scrollTop=0;return}
     const tt=totals(d);
     const ok=await PiLayer.pay(tt.total,'RealTap request escrow');
     if(!ok)return;
     const reqLabel=d.kind==='apptest'?d.appName.trim():(d.kind==='verify'?d.questions[0].text:d.title).trim();
     state.piBalance-=tt.total;state.history.unshift({k:'h_deposit',amt:-tt.total,note:reqLabel,at:now()});
     const id=Math.max(...state.tasks.map(x=>x.id))+1;
     const base={id,kind:d.kind,desc:d.desc.trim(),requester:state.me.username,rej:0,mode:d.mode,autoApprove:d.mode==='review'&&d.autoApprove,minutes:d.minutes,reward:d.reward,max:d.max,country:d.country,region:d.region||'ANY',gender:d.gender||'any',ageGroup:d.ageGroup||'any',lang:d.lang,sensitive:d.sensitive,status:'open',deadline:now()+d.hours*H,createdAt:now(),responses:[]};
     if(d.kind==='apptest'){
       const cleanSteps=d.steps.map(s=>s.trim()).filter(Boolean);
       const cleanCustom=d.customChecks.map(c=>c.trim()).filter(Boolean);
       Object.assign(base,{
         appName:d.appName.trim(),
         appVersion:d.appVersion.trim(),
         targetOs:d.targetOs||'any',
         appUrl:d.appUrl.trim(),
         steps:cleanSteps,
         checks:[...d.checks],
         customChecks:cleanCustom,
         title:'',
         questions:appQuestions(d.checks,cleanCustom)
       });
     }
     else{d.questions.forEach((q,i)=>{q.id='q'+(i+1);q.options=q.options.filter(o=>o.trim())});Object.assign(base,{title:(d.kind==='verify'?d.questions[0].text:d.title).trim(),questions:d.questions})}
     state.tasks.unshift(base);
     state.draft=null;state.tab='activity';state.seg='req';state.view=null;save();toast(t('published'));render()
    }

       ${r.status==='rejected'?`<div class="note err" style="margin-top:0.5rem">${esc(r.reason)}</div>${r.appealed?`<div class="small">${t('appealed')}</div>`:`<button class="btn sm line" style="margin-top:0.5rem" onclick="event.stopPropagation();appeal(${tk.id})">${t('appeal')}</button>`}`:''}</div>`}

       <div class="bar"><i style="width:${Math.min(100,tk.responses.length/tk.max*100)}%"></i></div></div>`}).join('')||`<div class="card" style="text-align:center"><div class="small" style="margin-bottom:0.6rem">${t('noAct')}<br>${t('noActHint')}</div><button class="btn p" onclick="go('explore')">${t('noActCta')}</button></div>`;
     const c=s=>s==='all'?done.length+req.length:s==='done'?done.length:req.length;
     return `<div class="seg">${['all','done','req'].map(s=>`<button class="${state.seg===s?'on':''}" onclick="state.seg='${s}';save();render()">${t('seg_'+s)} ${c(s)}</button>`).join('')}</div>${body}`
    }
    function appeal(id){const r=myResp(taskById(id));r.appealed=true;save();toast(t('appealed'));render()}

    function results(tk){
     const n=tk.responses.length||1;
     return tk.questions.map(q=>{
      if(q.type==='choice'){
        const c={};
        let blockerCnt=0,majorCnt=0,minorCnt=0;
        tk.responses.forEach(r=>{
          const a=r.answers[q.id];
          if(a)c[a]=(c[a]||0)+1;
          if(a==='problem'&&r.bugDetails&&r.bugDetails[q.id]){
            const sev=r.bugDetails[q.id].severity;
            if(sev==='blocker')blockerCnt++;
            else if(sev==='minor')minorCnt++;
            else majorCnt++;
          }
        });
        const worksCnt=c['works']||0;
        const passBadge=tk.kind==='apptest'?`<span class="tag ${worksCnt/n>=0.8?'g':'y'}" style="margin-left:0.35rem">${t('passRate',Math.round(worksCnt/n*100))}</span>`:'';
        const sevBadges=(blockerCnt||majorCnt||minorCnt)?`<div class="tags" style="margin-top:0.25rem">
          ${blockerCnt?`<span class="tag r">${t('sev_blocker').split(' (')[0]}: ${blockerCnt}</span>`:''}
          ${majorCnt?`<span class="tag y">${t('sev_major').split(' (')[0]}: ${majorCnt}</span>`:''}
          ${minorCnt?`<span class="tag b">${t('sev_minor').split(' (')[0]}: ${minorCnt}</span>`:''}
        </div>`:'';
        return `<div style="margin:0.75rem 0"><b style="font-size:0.86rem">${esc(qt(q))}</b>${passBadge}${sevBadges}${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([a,k])=>`<div class="kv" style="padding:0.18rem 0"><span style="color:${a==='problem'?'var(--red)':'var(--ink)'}">${esc(optLabel(a))}</span><span>${k} · ${Math.round(k/n*100)}%</span></div><div class="bar"><i style="width:${k/n*100}%;${a==='problem'?'background:var(--red)':''}"></i></div>`).join('')}</div>`;
      }
      if(q.type==='rating'){const v=tk.responses.map(r=>+r.answers[q.id]).filter(x=>x);const avg=v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):'–';
       return `<div class="kv"><span>${esc(qt(q))}</span><b>★ ${avg}</b></div>`}
      const tx=tk.responses.map(r=>r.answers[q.id]).filter(Boolean).slice(0,4);
      return tx.length?`<div style="margin:0.75rem 0"><b style="font-size:0.86rem">${esc(qt(q))}</b>${tx.map(x=>`<div class="small" style="color:var(--sub);margin-top:0.25rem">“${esc(x)}”</div>`).join('')}</div>`:''}).join('')
    }

    function vReview(id){

         return `<div class="small" style="margin-top:0.42rem">${esc(qt(q))}</div><div style="${a==='problem'?'color:var(--red);font-weight:700':''}">${esc(optLabel(a))}${sevTag}</div>${bugNote}${shotBadge}`;
       }).join('')}
       ${r.reason?`<div class="small" style="margin-top:0.35rem">↳ ${esc(r.reason)}</div>`:''}
       ${tk.status!=='settled'?`<div class="g2" style="margin-top:0.6rem"><button class="btn sm g" onclick="setResp(${tk.id},${r.id},'approved')">${t('accept')}</button><button class="btn sm red" onclick="rejectModal(${tk.id},${r.id})">${t('reject')}</button></div>`:''}</div>`).join(''):'';
     return `<button class="back" onclick="view(null)">${t('back')}</button><h2 style="font-size:1.05rem;font-weight:800;margin:0 0 0.6rem">${esc(ttl(tk))}</h2>

      ${tk.status==='settled'&&s?`<hr><div class="note ok">${t('settled')}</div>
       ${s.lowSample?`<div class="note warn" style="margin-top:0.35rem">${t('lowSample',CONFIG.minConsensus)}</div>`:''}${s.noConsensus?`<div class="note warn" style="margin-top:0.35rem">${t('noCons')}</div>`:''}
       <div class="kv"><span>${t('resWinners',s.winners,fmt(s.each))}</span></div><div class="kv"><span>${t('resLosers',s.losers)}</span></div><div class="kv"><span>${t('resRefund',fmt(s.refund))}</span></div>`

    function setResp(tid,rid,st){const r=taskById(tid).responses.find(x=>x.id===rid);r.status=st;r.reason='';save();render()}
    function rejectModal(tid,rid){
     openModal(`<h3>${t('reject')}</h3><label class="f">${t('rejectWhy')}</label>
      ${['rj1','rj2','rj3','rj4'].map((k,i)=>`<label class="opt"><input type="radio" name="rj" value="${k}" ${i===0?'checked':''}> ${t(k)}</label>`).join('')}
      <div class="g2" style="margin-top:0.75rem"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn red" onclick="doReject(${tid},${rid})">${t('reject')}</button></div>`)
    }
    function doReject(tid,rid){const k=document.querySelector('input[name="rj"]:checked').value;const r=taskById(tid).responses.find(x=>x.id===rid);r.status='rejected';r.reason=t(k);closeModal();save();render()}
    function settleTask(id){
     const tk=taskById(id);if(!tk||tk.status==='settled')return;
     const rs=tk.responses,n=rs.length,r=tk.reward,info={lowSample:false,noConsensus:false};
     let win=[],lose=[];
     if(tk.mode==='review'){rs.forEach(x=>{if(x.status==='submitted')x.status='approved'});win=rs.filter(x=>x.status==='approved');lose=rs.filter(x=>x.status==='rejected')}
     else{
      let match=rs.map(()=>true);
      if(n<CONFIG.minConsensus)info.lowSample=true;
      else tk.questions.forEach(q=>{if(q.type!=='choice')return;let target=q.gold;
        if(!target){const c={};rs.forEach(x=>{c[x.answers[q.id]]=(c[x.answers[q.id]]||0)+1});const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(top&&top[1]/n>0.5)target=top[0];else info.noConsensus=true}
        if(target)rs.forEach((x,i)=>{if(x.answers[q.id]!==target)match[i]=false})});
      if(info.lowSample||info.noConsensus)match=rs.map(()=>true);
      rs.forEach((x,i)=>x.status=match[i]?'correct':'wrong');
      win=rs.filter(x=>x.status==='correct');lose=rs.filter(x=>x.status==='wrong')
     }
     const pool=r*n;let each=0,back=0;
     if(win.length)each=pool/win.length;else back=pool;
     win.forEach(x=>{if(x.user===state.me.username&&!x.paid){x.paid=true;addPending(each,tk)}x.amount=each});lose.forEach(x=>x.amount=0);
     const refund=(tk.max-n)*r+back;
     if(tk.requester===state.me.username&&refund>0){state.piBalance+=refund;state.history.unshift({k:'h_refund',amt:refund,note:ttl(tk),at:now()})}
     tk.status='settled';tk.settlement={each,winners:win.length,losers:lose.length,refund,...info};
     save();toast(t('settled'));render()
    }

    /* Wallet History Search, Date-Range Filter & Timestamps */
    function formatDateTime(ts){
      const d=new Date(ts||now());
      if(Number.isNaN(d.getTime()))return '';
      const pad=v=>String(v).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function formatDateInputValue(ts){
      const d=new Date(ts||now());
      if(Number.isNaN(d.getTime()))return '';
      const pad=v=>String(v).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }
    function getFilteredHistory(){
      const q=(state.histQuery||'').trim().toLowerCase();
      const rangeMode=state.histFilterMode==='range';
      const fromTs=rangeMode&&state.histFrom?new Date(state.histFrom+'T00:00:00').getTime():null;
      const toTs=rangeMode&&state.histTo?new Date(state.histTo+'T23:59:59.999').getTime():null;
      return (state.history||[]).filter(h=>{
        const ts=h.at||now();
        if(rangeMode){
          if(fromTs&&!Number.isNaN(fromTs)&&ts<fromTs)return false;
          if(toTs&&!Number.isNaN(toTs)&&ts>toTs)return false;
        }
        if(!q)return true;
        const label=t(h.k).toLowerCase();
        const note=String(h.note||'').toLowerCase();
        const amtStr=((h.amt>=0?'+':'')+fmt(h.amt)+' π').toLowerCase();
        const dtStr=formatDateTime(ts).toLowerCase();
        return label.includes(q)||note.includes(q)||amtStr.includes(q)||dtStr.includes(q)||String(h.k||'').toLowerCase().includes(q);
      });
    }
    function renderHistoryListHtml(){
      const list=getFilteredHistory();
      if(!list.length){
        return `<div class="small" style="text-align:center;padding:0.75rem 0.25rem">${t('noHistory')}</div>`;
      }
      return list.map(h=>{
        const amtText=(h.amt>=0?'+':'')+fmt(h.amt)+' π';
        const dtText=formatDateTime(h.at||now());
        return `<div class="hist-item">
          <div>
            <div class="hist-label">${esc(t(h.k))}${h.note?` <span class="small">· ${esc(h.note)}</span>`:''}</div>
            <div class="hist-time">🕒 ${esc(dtText)}</div>
          </div>
          <b class="hist-amt" style="color:${h.amt>=0?'var(--green)':'var(--red)'}">${esc(amtText)}</b>
        </div>`;
      }).join('');
    }
    function onHistorySearch(val){
      state.histQuery=val;
      save();
      const box=$('walletHistoryList');
      const cnt=$('walletHistoryCount');
      const clr=$('histSearchClear');
      if(clr)clr.style.display=val?'inline-flex':'none';
      if(box)box.innerHTML=renderHistoryListHtml();
      if(cnt)cnt.textContent=t('historyCount',getFilteredHistory().length);
    }
    function setHistoryFilterMode(mode){
      state.histFilterMode=mode;
      if(mode==='range'){
        if(!state.histFrom)state.histFrom=formatDateInputValue(now()-14*D);
        if(!state.histTo)state.histTo=formatDateInputValue(now());
      }
      save();
      render();
    }
    function onHistoryDateChange(){
      const f=$('histFromInput');
      const to=$('histToInput');
      if(f)state.histFrom=f.value;
      if(to)state.histTo=to.value;
      save();
      const box=$('walletHistoryList');
      const cnt=$('walletHistoryCount');
      if(box)box.innerHTML=renderHistoryListHtml();
      if(cnt)cnt.textContent=t('historyCount',getFilteredHistory().length);
    }
    function resetHistoryFilters(){
      state.histQuery='';
      state.histFilterMode='all';
      state.histFrom='';
      state.histTo='';
      save();
      render();
    }

      <p class="small">${t('wRule',min,CONFIG.holdDays,CONFIG.withdrawFeePct)}</p>

     <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:0.45rem">
        <h3 style="margin:0">${t('history')}</h3>
        <span id="walletHistoryCount" class="tag b">${t('historyCount',filtered.length)}</span>
      </div>
      <div class="hist-controls">
        <div class="search-wrap" style="margin-bottom:0">
          <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="walletHistorySearch" class="search-in" type="search" value="${esc(state.histQuery||'')}" placeholder="${t('searchHistory')}" oninput="onHistorySearch(this.value)" />
          <button id="histSearchClear" type="button" class="search-clear" style="display:${hasQuery?'inline-flex':'none'}" onclick="onHistorySearch('');$('walletHistorySearch').value='';$('walletHistorySearch').focus()" aria-label="Clear">✕</button>
        </div>
        <div class="hist-filter-row">
          <div class="hist-mode-pills">
            <button type="button" class="hist-mode-btn ${!isRange?'on':''}" onclick="setHistoryFilterMode('all')">${t('allTime')}</button>
            <button type="button" class="hist-mode-btn ${isRange?'on':''}" onclick="setHistoryFilterMode('range')">${t('dateRange')}</button>

          ${(hasQuery||isRange)?`<button type="button" class="btn sm line" onclick="resetHistoryFilters()">${t('clearFilter')}</button>`:''}
        </div>
        ${isRange?`<div class="hist-dates">
          <input id="histFromInput" class="hist-date-in" type="date" value="${esc(state.histFrom||'')}" aria-label="${t('fromDate')}" onchange="onHistoryDateChange()" />
          <input id="histToInput" class="hist-date-in" type="date" value="${esc(state.histTo||'')}" aria-label="${t('toDate')}" onchange="onHistoryDateChange()" />
          <button type="button" class="btn sm" onclick="resetHistoryFilters()">${t('allTime')}</button>
        </div>`:''}
      </div>
      <div id="walletHistoryList">${renderHistoryListHtml()}</div>
     </div>`
    }
    function topupModal(){
     openModal(`<h3>🟣 ${t('topupTitle')}</h3>
      <div class="chips" style="flex-wrap:wrap">${[1,5,10,20].map(v=>`<button class="chip" onclick="$('tpa').value=${v}">π ${v}</button>`).join('')}</div>
      <label class="f">${t('topupAmt')}</label><input class="in" id="tpa" type="number" min="0.1" max="100" step="0.1" value="5">
      <p class="small">${t('topupNote')}</p>
      <div class="g2"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn p" onclick="doTopup()">${t('topupTitle')}</button></div>`)
    }
    async function doTopup(){
     const a=+$('tpa').value;
     if(!(a>0)){toast(t('topupMin'));return}
     if(a>100){toast(t('topupMax'));return}
     closeModal();
     const ok=await PiLayer.pay(a,'RealTap top-up');
     if(!ok)return;
     state.piBalance+=a;state.history.unshift({k:'h_topup',amt:a,note:'Pi wallet',at:now()});save();toast(t('topupDone',fmt(a)));render()
    }
    function wCalc(a){const fee=a*CONFIG.withdrawFeePct/100;return{fee,net:a-fee}}
    function updWd(){const a=+$('wa').value||0,c=wCalc(a);$('wfee').textContent='π '+fmt(c.fee);$('wnet').textContent='π '+fmt(c.net)}
    function withdrawModal(){
     openModal(`<h3>${t('withdraw')}</h3><label class="f">${t('wAmt')}</label><input class="in" id="wa" type="number" step="0.01" min="${CONFIG.minWithdraw}" max="${fmt(state.earn.available)}" value="${fmt(state.earn.available)}" oninput="updWd()">
      <div class="card" style="margin:0.6rem 0;background:var(--surface-alt)"><div class="kv"><span>${t('wFee',CONFIG.withdrawFeePct)}</span><b id="wfee"></b></div><div class="kv"><span>${t('wNet')}</span><b class="pi" id="wnet"></b></div></div>
      <p class="small">${t('wRule',CONFIG.minWithdraw,CONFIG.holdDays,CONFIG.withdrawFeePct)}</p>
      <div class="g2"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn p" onclick="doWithdraw()">${t('wSend')}</button></div>`);updWd()
    }
    async function doWithdraw(){
     const a=+$('wa').value;
     if(!(a>=CONFIG.minWithdraw)||a>state.earn.available+1e-9){toast(t('wMin',CONFIG.minWithdraw));return}
     const c=wCalc(a);
     closeModal();await PiLayer.payout(c.net);
     state.earn.available-=a;state.history.unshift({k:'h_withdraw',amt:-a,note:'Fee π '+fmt(c.fee)+' · Received π '+fmt(c.net),at:now()});save();toast(t('wDone'));render()
    }

    /* Me Profile Helpers: Avatar, Nickname, Cooldowns, Saved & Recent */
    function handleAvatarUpload(input){
      const file=input.files&&input.files[0];
      if(!file)return;
      if(file.size>2*1024*1024){toast('Max 2MB image');return}
      const reader=new FileReader();
      reader.onload=e=>{
        state.me.avatarData=e.target.result;
        save();
        render();
        toast(t('fieldUpdated'));
      };
      reader.readAsDataURL(file);
    }
    function selectAvatarPreset(em){
      state.me.avatarData='';
      state.me.avatarPreset=em;
      save();
      render();
    }
    function saveNickname(){
      const inp=$('meNickInput');
      if(!inp)return;
      const val=inp.value.trim();
      const low=val.toLowerCase();
      if(val.length<2||val.length>16||BANNED.some(b=>low.includes(b))){
        toast(t('nickInvalid'));
        return;
      }
      state.me.nickname=val;
      save();
      toast(t('nickSaved'));
      render();
    }
    function getCountryCooldown(){
      const next=(state.me.lastCountryChange||0)+CONFIG.yearMs;
      if(!state.me.lastCountryChange||now()>=next)return {locked:false,leftText:''};
      return {locked:true,leftText:remain(next),until:formatDateTime(next)};
    }
    function getRegionCooldown(){
      const next=(state.me.lastRegionChange||0)+CONFIG.monthMs;
      if(!state.me.lastRegionChange||now()>=next)return {locked:false,leftText:''};
      return {locked:true,leftText:remain(next),until:formatDateTime(next)};
    }
    function applyCountryChange(newCountry){
      const prev=state.me.country;
      if(newCountry===prev)return;
      const cd=getCountryCooldown();
      if(cd.locked){toast(t('cooldownLocked',cd.leftText));render();return}
      const nextDate=formatDateTime(now()+CONFIG.yearMs);
      openModal(`<h3>${t('confirmFieldChange')}</h3><p class="small">${t('confirmFieldMsg',t('myCountry'),nextDate)}</p>
        <div class="g2" style="margin-top:0.75rem"><button class="btn" id="ccNo">${t('cancel')}</button><button class="btn p" id="ccYes">${t('submit')}</button></div>`);
      $('ccNo').onclick=()=>{closeModal();render()};
      $('ccYes').onclick=()=>{
        state.me.country=newCountry;
        state.me.region='ANY';
        state.me.lastCountryChange=now();
        closeModal();
        save();
        toast(t('fieldUpdated'));
        render();
      };
    }
    function applyRegionChange(newRegion){
      const prev=state.me.region||'ANY';
      if(newRegion===prev)return;
      const cd=getRegionCooldown();
      if(cd.locked){toast(t('cooldownLocked',cd.leftText));render();return}
      const nextDate=formatDateTime(now()+CONFIG.monthMs);
      openModal(`<h3>${t('confirmFieldChange')}</h3><p class="small">${t('confirmFieldMsg',t('region'),nextDate)}</p>
        <div class="g2" style="margin-top:0.75rem"><button class="btn" id="rcNo">${t('cancel')}</button><button class="btn p" id="rcYes">${t('submit')}</button></div>`);
      $('rcNo').onclick=()=>{closeModal();render()};
      $('rcYes').onclick=()=>{
        state.me.region=newRegion;
        state.me.lastRegionChange=now();
        closeModal();
        save();
        toast(t('fieldUpdated'));
        render();
      };
    }
    function applyLockedProfileField(field,val){
      const isGender=field==='gender';
      const locked=isGender?Boolean(state.me.genderLocked):Boolean(state.me.ageLocked);
      if(locked){toast(t('cooldownLocked',isGender?t('gender'):t('ageGroup')));render();return}
      const label=isGender?t('gender'):t('ageGroup');
      const dispVal=isGender?gname(val):agename(val);
      openModal(`<h3>${t('confirmFieldChange')}</h3><p class="small">${t('confirmFieldMsg',label+' · '+dispVal,t('cooldownLocked','∞'))}</p>
        <div class="g2" style="margin-top:0.75rem"><button class="btn" id="lpNo">${t('cancel')}</button><button class="btn p" id="lpYes">${t('submit')}</button></div>`);
      $('lpNo').onclick=()=>{closeModal();render()};
      $('lpYes').onclick=()=>{
        if(isGender){state.me.gender=val;state.me.genderLocked=true}
        else{state.me.ageGroup=val;state.me.ageLocked=true}
        closeModal();
        save();
        toast(t('fieldUpdated'));
        render();
      };
    }
    function toggleMeList(kind){
      state.meListView=state.meListView===kind?null:kind;
      save();
      render();
    }
    function renderMeSavedOrRecent(){
      if(!state.meListView)return '';
      if(state.meListView==='saved'){
        const items=(state.saved||[]).map(taskById).filter(Boolean);
        return `<div class="card"><h3>${t('savedListTitle')} (${items.length})</h3>${items.length?items.map(taskCard).join(''):`<div class="small" style="text-align:center;padding:0.5rem 0">${t('noSaved')}</div>`}</div>`;
      }
      const recItems=(state.recent||[]).map(taskById).filter(Boolean);
      return `<div class="card"><h3>${t('recentListTitle')} (${recItems.length})</h3>${recItems.length?recItems.map(taskCard).join(''):`<div class="small" style="text-align:center;padding:0.5rem 0">${t('emptyRecent')}</div>`}</div>`;
    }

       </div>
       <label class="f">${t('profilePhoto')}</label>
       <div class="row" style="flex-wrap:wrap;gap:0.4rem">

       </div>
       <div class="preset-av-row">${AVATAR_PRESETS.map(em=>`<button type="button" class="preset-av-btn ${!m.avatarData&&m.avatarPreset===em?'on':''}" onclick="selectAvatarPreset('${em}')">${em}</button>`).join('')}</div>
     </div>
     <div class="me-quick-grid">
       <button type="button" class="me-quick-btn ${state.meListView==='saved'?'on':''}" onclick="toggleMeList('saved')">
         <div><div class="title" style="font-size:0.84rem">♥ ${t('savedListTitle')}</div><div class="small">${t('countItems',savedCnt)}</div></div>
         <span>›</span>
       </button>
       <button type="button" class="me-quick-btn ${state.meListView==='recent'?'on':''}" onclick="toggleMeList('recent')">

         <span>›</span>
       </button>
     </div>
     ${renderMeSavedOrRecent()}
     <div class="card">
      <h3>${t('targetProfile')}</h3>
      <label class="f" style="margin-top:0.2rem">${t('myCountry')} <span class="small">(${cCd.locked?t('cooldownLocked',cCd.leftText):t('cooldownYear')})</span></label>
      <select class="in" ${cCd.locked?'disabled':''} onchange="applyCountryChange(this.value)">${Object.keys(CN).filter(c=>c!=='ANY').map(c=>`<option value="${c}" ${m.country===c?'selected':''}>${flag(c)} ${cname(c)}</option>`).join('')}</select>
      <label class="f">${t('region')} <span class="small">(${rCd.locked?t('cooldownLocked',rCd.leftText):t('cooldownMonth')})</span></label>
      <select class="in" ${rCd.locked?'disabled':''} onchange="applyRegionChange(this.value)">${opts(regList,m.region||'ANY')}</select>
      <div class="g2">
        <div>
          <label class="f">${t('gender')} <span class="small">(${m.genderLocked?t('cooldownLocked','∞'):''})</span></label>
          <select class="in" ${m.genderLocked?'disabled':''} onchange="applyLockedProfileField('gender',this.value)">${opts(GENDERS.map(g=>[g,gname(g)]),m.gender||'any')}</select>
        </div>
        <div>
          <label class="f">${t('ageGroup')} <span class="small">(${m.ageLocked?t('cooldownLocked','∞'):''})</span></label>
          <select class="in" ${m.ageLocked?'disabled':''} onchange="applyLockedProfileField('ageGroup',this.value)">${opts(AGE_GROUPS.map(a=>[a,agename(a)]),m.ageGroup||'any')}</select>
        </div>
      </div>
      <p class="small" style="margin:0.55rem 0 0">${t('cooldownNote')}</p>
     </div>
     <div class="card">
      <label class="f" style="margin-top:0">${t('sheetSurface')}</label>
      <div class="seg"><button class="${state.sheetMode!=='dark'?'on':''}" onclick="setSheetMode('light')">☀️ ${t('sheetLight')}</button><button class="${state.sheetMode==='dark'?'on':''}" onclick="setSheetMode('dark')">🌙 ${t('sheetDark')}</button></div>
      <label class="f">${t('uiLang')}</label><select class="in" id="uil" onchange="setLang(this.value)">${Object.entries(UILANG).map(([k,v])=>`<option value="${k}" ${state.lang===k?'selected':''}>${v}</option>`).join('')}</select>
      <label class="f">${t('textSize')}</label><div class="seg" style="margin-bottom:0">${['s','m','l'].map(s=>`<button class="${state.fs===s?'on':''}" onclick="setFs('${s}')">${t('fs_'+s)}</button>`).join('')}</div></div>
     <details><summary>${t('privacy')}</summary><div class="card small">${t('privacyNote')}<br><br>${t('privacyBody')}</div></details>
     <details><summary>${t('rulesTitle')}</summary><div class="card small">${['r1','r2','r3','r4','r5'].map(r=>'• '+t(r)).join('<br>')}</div></details>
     <details><summary>${t('demo')}</summary><div class="card"><button class="btn full" onclick="ffwd()">${t('ffwd')}</button>
      <button class="btn full" style="margin-top:0.5rem" onclick="settleMine()">${t('settleMine')}</button>

    }
    function topup(){state.piBalance+=10;state.history.unshift({k:'h_topup',amt:10,note:'Demo top-up',at:now()});save();toast('+π 10');render()}

    applyPrefs();
    render();
